<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0e32">
    
    <!-- 1. Judul Website -->
    <title>Woker</title>

    <!-- 2. Pengaturan Icon dan iOS Web App (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Woker">
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="shortcut icon" href="./logo.png">

    <!-- Libraries: spreadsheet export + icon set -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Pre-load Dark Theme Script to avoid flash -->
    <script>
        if (localStorage.getItem('woker_dark') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        /* =====================================================
           WOKER DESIGN TOKENS
           ===================================================== */
        :root {
            /* Brand navy scale (darkest -> lightest) */
            --navy-950: #0a0926;
            --navy-900: #0f0e32;   
            --navy-800: #161440;
            --navy-700: #1b194f;
            --navy-600: #232162;
            --navy-500: #2c2a7b;   

            --accent: var(--navy-500);
            --accent-soft: #f0f4ff;
            --accent-border: #c7d2fe;

            /* Neutral surfaces & text - LIGHT MODE (Default) */
            --bg: #fcfcfd;
            --card: #ffffff;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-soft: #475569;
            --text-muted: #94a3b8;
            --text-faint: #cbd5e1;

            /* Semantic colors */
            --success: #10b981;
            --info: #3b82f6;
            --warning: #f97316;
            --warning-soft: #fff7ed;
            --warning-border: #fed7aa;
            --danger: #ef4444;
            --danger-soft: #fef2f2;

            /* Spacing scale */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

            /* Radii */
            --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
            --r-xl: 28px; --r-2xl: 36px; --r-pill: 999px;

            /* Elevation */
            --shadow-sm: 0 1px 3px rgb(15 14 50 / .06);
            --shadow-md: 0 4px 20px -5px rgb(15 14 50 / .12);
            --shadow-lg: 0 20px 50px -20px rgb(15 14 50 / .35);
            --shadow-2xl: 0 25px 50px -12px rgb(15 14 50 / .25);

            /* Typography */
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --track: .18em;

            --ease: cubic-bezier(.4, 0, .2, 1);
        }

        /* DARK MODE OVERRIDES - Premium, rich dark indigo palette */
        [data-theme="dark"] {
            --bg: #090a0f;
            --card: #11131c;
            --surface: #181b28;
            --border: #262a3d;
            --border-light: #1c1f2e;
            --text: #f8fafc;
            --text-soft: #cbd5e1;
            --text-muted: #64748b;
            --text-faint: #475569;
            
            --navy-950: #050608;
            --navy-900: #0a0c12; 
            --navy-800: #12151e;
            
            --accent: #6366f1;
            --accent-soft: rgba(99, 102, 241, 0.15);
            --accent-border: rgba(99, 102, 241, 0.3);

            --warning-soft: rgba(249, 115, 22, 0.15);
            --warning-border: rgba(249, 115, 22, 0.3);
            
            --danger-soft: rgba(239, 68, 68, 0.15);

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 20px -5px rgba(0,0,0,0.6);
            --shadow-lg: 0 20px 50px -20px rgba(0,0,0,0.7);
            --shadow-2xl: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        /* ---------- Base ---------- */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s var(--ease), color 0.3s var(--ease);
        }
        input, textarea, select, button { font-family: var(--font); font-size: 16px; }
        img, svg { display: block; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: var(--r-pill); }

        .lucide { width: 1em; height: 1em; stroke-width: 2.4; }

        /* ---------- Shared text styles ---------- */
        .label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: var(--track);
            color: var(--text-muted);
            margin: 0 0 var(--sp-1) var(--sp-1);
        }
        .brand-logo {
            margin: 0;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -.04em;
            line-height: 1;
            color: #fff;
        }
        .brand-tag {
            margin: var(--sp-1) 0 0;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .35em;
            color: var(--text-muted);
        }

        /* ---------- Inputs ---------- */
        .field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
        .field input, .field textarea {
            width: 100%;
            padding: 14px var(--sp-4);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-weight: 700;
            color: var(--text);
            outline: none;
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
            appearance: none;
            -webkit-appearance: none;
        }
        .field input::placeholder, .field textarea::placeholder { color: var(--text-faint); font-weight: 600; }
        .field input:focus, .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .field textarea { min-height: 120px; resize: vertical; font-weight: 500; line-height: 1.6; }
        .input-optional { background: var(--accent-soft) !important; border-color: var(--accent-border) !important; color: var(--accent) !important; }
        .hint-optional { margin: 2px 0 0 var(--sp-1); font-size: 9px; font-weight: 800; font-style: italic; color: var(--warning); }
        .field-row { display: flex; gap: var(--sp-4); }
        .field-row .field { flex: 1; }
        @media (max-width: 480px) { .field-row { flex-direction: column; } }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
            border: none;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: var(--track);
            font-size: 11px;
            padding: var(--sp-4) var(--sp-6);
            border-radius: var(--r-md);
            transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
            user-select: none;
        }
        .btn:active { transform: scale(.97); }
        .btn:disabled { cursor: not-allowed; transform: none; }
        .btn .lucide { font-size: 15px; }

        .btn-primary { background: var(--navy-900); color: #fff; box-shadow: var(--shadow-md); }
        .btn-primary:hover { background: var(--navy-800); }
        .btn-primary:disabled { background: var(--border-light); color: var(--text-faint); box-shadow: none; }
        [data-theme="dark"] .btn-primary { background: var(--accent); }
        [data-theme="dark"] .btn-primary:hover { background: #4f46e5; }
        [data-theme="dark"] .btn-primary:disabled { background: var(--surface); }

        .btn-ghost { background: var(--border-light); color: var(--text-soft); }
        .btn-ghost:hover { background: var(--border); }

        .btn-danger { background: var(--danger); color: #fff; box-shadow: var(--shadow-md); }
        .btn-danger:hover { background: #dc2626; }

        .btn-block { width: 100%; padding-top: 18px; padding-bottom: 18px; }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--sp-2);
            border-radius: var(--r-sm);
            color: var(--text-faint);
            transition: color .2s var(--ease), background .2s var(--ease);
        }
        .icon-btn .lucide { font-size: 18px; }

        .spinner {
            width: 15px; height: 15px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Cards ---------- */
        .card {
            background: var(--card);
            border: 1px solid var(--border-light);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-md);
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
        }

        /* =====================================================
           AUTH SCREENS (Redesigned Split Layout)
           ===================================================== */
        .auth-split { display: flex; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
        .auth-brand { 
            flex: 1; 
            background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 100%); 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            padding: var(--sp-10); 
            position: relative; 
            overflow: hidden; 
        }
        @media(min-width: 900px) { .auth-brand { display: flex; } }
        .auth-brand-inner { position: relative; z-index: 2; max-width: 500px; margin: 0 auto; text-align: left; }
        .auth-brand .brand-logo { font-size: 64px; text-align: left; }
        .auth-brand .brand-tag { font-size: 12px; letter-spacing: 0.4em; opacity: 0.8; margin-top: 10px; color: #cbd5e1; }
        .auth-glow { 
            position: absolute; width: 600px; height: 600px; 
            background: var(--accent); filter: blur(160px); 
            opacity: 0.15; border-radius: 50%; 
            bottom: -200px; left: -100px; pointer-events: none; 
        }
        .auth-pattern {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4; pointer-events: none;
        }
        
        .auth-form-wrap { 
            flex: 1; max-width: 650px; width: 100%; margin: 0 auto;
            display: flex; flex-direction: column; justify-content: center; 
            background: var(--card); position: relative; 
            box-shadow: -20px 0 50px rgba(0,0,0,0.1); 
            padding: var(--sp-10) var(--sp-6);
        }
        [data-theme="dark"] .auth-form-wrap { box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
        .auth-top-bar { position: absolute; top: var(--sp-6); right: var(--sp-8); display: flex; gap: var(--sp-2); }
        
        .auth-body { max-width: 400px; width: 100%; margin: 0 auto; }
        .mobile-brand { display: block; text-align: center; margin-bottom: 48px; }
        .mobile-brand .brand-logo { color: var(--navy-900); font-size: 40px; }
        [data-theme="dark"] .mobile-brand .brand-logo { color: #fff; }
        @media(min-width: 900px) { .mobile-brand { display: none; } }

        .auth-title {
            margin: 0 0 var(--sp-2); font-size: 32px; font-weight: 900;
            text-transform: uppercase; letter-spacing: -.03em; color: var(--text);
        }
        .auth-sub { margin: 0 0 var(--sp-10); font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.5; }
        
        .auth-form { display: flex; flex-direction: column; gap: var(--sp-6); }
        .code-input {
            width: 100%; padding: var(--sp-5); background: var(--surface);
            border: 2px solid var(--border-light); border-radius: var(--r-lg);
            outline: none; font-size: 24px; font-weight: 900; text-align: center;
            text-transform: uppercase; letter-spacing: .25em; color: var(--text);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            transition: border-color .2s var(--ease), background .2s var(--ease);
        }
        .code-input:focus { border-color: var(--accent); }
        .code-input.invalid { border-color: var(--danger); }
        .remember {
            display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
            cursor: pointer; font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: var(--track); color: var(--text-muted);
        }
        .remember input { width: 18px; height: 18px; accent-color: var(--accent); }
        .auth-note {
            margin: var(--sp-6) 0 0; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .1em; line-height: 1.8;
            text-align: center; color: var(--text-faint);
        }

        .lang-toggle-btn {
            background: var(--surface); color: var(--text-soft);
            border: 1px solid var(--border); border-radius: var(--r-pill);
            padding: 6px 14px; font-size: 10px; font-weight: 900;
            cursor: pointer; transition: all 0.2s var(--ease);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .lang-toggle-btn:hover { background: var(--border-light); color: var(--text); }
        .lang-toggle-btn .lucide { font-size: 12px; }

        /* =====================================================
           APP SHELL
           ===================================================== */
        .app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; }

        .app-header {
            background: var(--navy-900);
            border-bottom: 1px solid var(--navy-600);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--sp-4) var(--sp-6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--sp-3);
        }
        .header-inner .brand-logo { font-size: 22px; }
        .header-actions { position: absolute; right: var(--sp-6); top: var(--sp-4); display: flex; gap: var(--sp-1); }
        @media (min-width: 768px) {
            .header-inner { flex-direction: row; justify-content: space-between; padding: var(--sp-5) var(--sp-8); position: relative; }
            .header-inner .brand { text-align: left; }
            .header-inner .brand-logo { font-size: 28px; }
            .header-actions { position: static; }
        }
        .header-inner .brand { text-align: center; }

        .month-nav {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            background: var(--navy-800);
            border: 1px solid var(--navy-600);
            border-radius: var(--r-pill);
            padding: 6px var(--sp-3);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
        }
        .month-btn {
            background: none; border: none; cursor: pointer;
            color: #fff; padding: var(--sp-2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s var(--ease), color .2s var(--ease);
        }
        .month-btn:hover { background: rgba(255,255,255,0.1); color: var(--info); }
        .month-btn .lucide { font-size: 18px; }
        .month-label { text-align: center; min-width: 130px; line-height: 1.2; }
        .month-name {
            display: block; color: #fff; font-size: 14px;
            font-weight: 900; text-transform: uppercase; letter-spacing: var(--track);
        }
        .month-year { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        .top-action-btn { color: #fff; opacity: 0.7; }
        .top-action-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .app-main { width: 100%; max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) 0; }
        @media (min-width: 768px) { .app-main { padding: var(--sp-8) var(--sp-8) 0; } }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
            background: var(--card); border: 1px solid var(--border-light);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            padding: var(--sp-3) var(--sp-5); margin-bottom: var(--sp-6);
            font-size: 11px; font-weight: 900; text-transform: uppercase;
            letter-spacing: .12em; overflow: hidden;
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
        }
        .status-left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .sync-dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .sync-dot.busy { background: var(--info); animation: pulse 1.4s ease-in-out infinite; }
        .sync-dot.error { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
        @keyframes pulse { 50% { opacity: .35; } }
        .status-name { color: var(--text); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-name .lucide { font-size: 13px; color: var(--text-muted); }
        .status-sep { color: var(--border); }
        .status-id { color: var(--text-muted); white-space: nowrap; }
        @media (max-width: 560px) { .status-sep, .status-id { display: none; } }
        .btn-logout {
            display: inline-flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer; color: var(--danger);
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em;
            padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
            transition: background .2s var(--ease); flex-shrink: 0;
        }
        .btn-logout:hover { background: var(--danger-soft); }
        .btn-logout .lucide { font-size: 13px; }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex; background: var(--card); border: 1px solid var(--border-light);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            padding: var(--sp-1); margin-bottom: var(--sp-8);
        }
        .tab-btn {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
            border: none; background: none; cursor: pointer; padding: var(--sp-3) var(--sp-4);
            border-radius: var(--r-md); font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: var(--track); color: var(--text-muted);
            transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
        }
        .tab-btn .lucide { font-size: 14px; }
        .tab-btn.active { background: var(--navy-900); color: #fff; box-shadow: var(--shadow-md); }
        [data-theme="dark"] .tab-btn.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        /* =====================================================
           INPUT TAB: form + history
           ===================================================== */
        .work-grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-8); align-items: start; }
        @media (min-width: 1024px) {
            .work-grid { grid-template-columns: 5fr 7fr; gap: var(--sp-10); }
            .form-col { position: sticky; top: 132px; }
            .list-col { max-height: calc(100vh - 150px); overflow-y: auto; padding: 0 var(--sp-2) var(--sp-4) 0; }
        }

        .entry-form {
            padding: var(--sp-8) var(--sp-6);
            border-top: 6px solid var(--accent);
            display: flex; flex-direction: column; gap: var(--sp-4);
        }
        @media (min-width: 768px) { .entry-form { padding: var(--sp-10) var(--sp-8); } }
        .form-title {
            margin: 0; padding-bottom: var(--sp-4); border-bottom: 1px solid var(--border-light);
            font-size: 15px; font-weight: 900; font-style: italic; text-transform: uppercase;
            letter-spacing: -.02em; color: var(--text); display: flex; align-items: center; gap: var(--sp-2);
        }
        .form-title .lucide { font-size: 16px; color: var(--accent); }
        .form-status { margin: 0; min-height: 14px; text-align: center; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
        .form-status.is-loading { color: var(--warning); animation: pulse 1.4s ease-in-out infinite; }
        .form-status.is-error { color: var(--danger); }

        .list-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-4); margin-bottom: var(--sp-4); }
        .list-title { margin: 0; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .3em; color: var(--text); }
        .count-badge { font-size: 10px; font-weight: 900; color: var(--text-muted); background: var(--border-light); padding: var(--sp-1) var(--sp-3); border-radius: var(--r-pill); }

        .entry-list { display: flex; flex-direction: column; gap: var(--sp-4); }
        .entry-card {
            display: flex; align-items: flex-start; gap: var(--sp-4);
            background: var(--card); border: 1px solid var(--border-light);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            padding: var(--sp-5); transition: border-color .25s var(--ease), box-shadow .25s var(--ease), transform .25s var(--ease);
        }
        .entry-card:hover { border-color: rgba(99, 102, 241, 0.3); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .entry-card.is-running { border-color: var(--warning-border); }

        .date-badge {
            width: 52px; height: 52px; flex-shrink: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: var(--r-md);
            background: var(--navy-900); border: 1px solid var(--navy-600); color: #fff; box-shadow: var(--shadow-md);
        }
        [data-theme="dark"] .date-badge { background: var(--surface); border-color: var(--border); }
        .entry-card.is-running .date-badge { background: var(--warning); border-color: #ea580c; animation: pulse 1.6s ease-in-out infinite; }

                groups[entry.client].push(entry);
            });
            return Object.entries(groups).sort(function (a, b) { return a[0].localeCompare(b[0]); });
        }

        function getTotalHours(filtered) {
            return filtered.reduce(function (sum, e) { return sum + parseFloat(e.hours || 0); }, 0);
        }

        /* =====================================================

        function showToast(message, icon) {
            var rootEl = $('#toast-root');
            if (!rootEl) {
                rootEl = document.createElement('div');
                rootEl.id = 'toast-root';
                document.body.appendChild(rootEl);
            }
            var toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = '<i data-lucide="' + (icon || 'check-circle-2') + '"></i><span>' + esc(message) + '</span>';
            rootEl.appendChild(toast);
            refreshIcons();
            requestAnimationFrame(function () { toast.classList.add('show'); });
            setTimeout(function () {
                toast.classList.remove('show');
                setTimeout(function () { toast.remove(); }, 300);
            }, 2600);
        }

        function openModal(innerHTML, dismissible) {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = '<div class="modal-panel">' + innerHTML + '</div>';
            if (dismissible) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeModal(overlay);
                });
            }
            document.body.appendChild(overlay);
            refreshIcons();
            requestAnimationFrame(function () { overlay.classList.add('open'); });
            return overlay;
        }

        function closeModal(overlay) {
            overlay.classList.remove('open');
            setTimeout(function () { overlay.remove(); }, 200);
        }

        function showInfoModal(message) {
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="info"></i></div>' +
                '<h4 class="modal-title">Info</h4>' +
                '<p class="modal-sub">' + esc(message) + '</p>' +
                '<button class="btn btn-primary btn-block" data-modal-close>' + (state.lang==='id'?'Tutup':'Close') + '</button>',
                true
            );
            overlay.querySelector('[data-modal-close]').addEventListener('click', function () { closeModal(overlay); });
        }

        function showConfirm(message, confirmBtnText, onConfirm) {
            var overlay = openModal(
                '<div class="modal-icon danger"><i data-lucide="alert-triangle"></i></div>' +
                '<h4 class="modal-title">' + t('modalConfirm') + '</h4>' +
                '<p class="modal-sub">' + esc(message) + '</p>' +
                '<div class="modal-actions">' +
                '  <button class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button class="btn btn-danger" data-modal-ok>' + confirmBtnText + '</button>' +
                '</div>'
            );
            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-ok]').addEventListener('click', function () {
                closeModal(overlay);
                onConfirm();
            });
        }

        /* =====================================================
           Firebase: auth bootstrap + Firestore subscription
           ===================================================== */
        function bootFirebase() {
            if (window.FirebaseServices) { setupAuth(); return; }
            var onReady = function () { setupAuth(); };
            window.addEventListener('firebase-ready', onReady, { once: true });
            var interval = setInterval(function () {
                if (window.FirebaseServices) {
                    clearInterval(interval);
                    window.removeEventListener('firebase-ready', onReady);
                    setupAuth();
                } else if (window.FirebaseSetupError) {
                    clearInterval(interval);
                    window.removeEventListener('firebase-ready', onReady);
                    state.cloudError = true;
                    showInfoModal(window.FirebaseSetupError);
                    updateConnectionUI();
                }
            }, 200);
        }

        async function setupAuth() {
            if (state.authStarted) return;
            state.authStarted = true;
            var fs = window.FirebaseServices;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await fs.signInWithCustomToken(fs.auth, __initial_auth_token);
                } else {
                    await fs.signInAnonymously(fs.auth);
                }
                fs.onAuthStateChanged(fs.auth, function (u) {
                    state.user = u;
                    state.firebaseReady = true;
                    updateConnectionUI();
                    ensureSubscription();
                });
            } catch (error) {
                console.error('Auth Error:', error);
                state.cloudError = true;
                showInfoModal(state.lang === 'id' ? 'Gagal masuk ke layanan Cloud.' : 'Failed to sign in to Cloud services.');
                updateConnectionUI();
            }
        }

        function ensureSubscription() {
            if (!state.firebaseReady || !state.user || !state.isLoggedIn ||
                !state.accessKey || !state.userName || !window.FirebaseServices) return;

            var key = safeCollectionKey(state.accessKey);
            if (state.subscribedKey === key) return;
            if (state.unsubscribe) { state.unsubscribe(); state.unsubscribe = null; }

            state.subscribedKey = key;
            state.isCloudSyncing = true;
            updateStatusBar();

            var fs = window.FirebaseServices;
            var colRef = fs.collection(fs.db, 'artifacts', fs.appId, 'public', 'data', key);
            state.unsubscribe = fs.onSnapshot(colRef, function (snapshot) {
                state.entries = snapshot.docs.map(function (d) {
                    return Object.assign({ id: d.id }, d.data());
                });
                state.isCloudSyncing = false;
                state.cloudError = false;
                state.hasLoadedOnce = true;
                refreshDynamic();
                updateConnectionUI();
            }, function (error) {
                console.error('Firestore Error:', error);
                state.cloudError = true;
                state.isCloudSyncing = false;
                state.hasLoadedOnce = true;
                showInfoModal(state.lang === 'id' ? "Gagal membaca data dari Cloud." : "Failed to read data from Cloud.");
                refreshDynamic();
                updateConnectionUI();
            });
        }

                '      <span class="stat-chip"><i data-lucide="building-2"></i>' + clientCount + ' ' + t('clients') + '</span>' +
                       (runningCount > 0 ? '<span class="stat-chip"><i data-lucide="timer"></i>' + runningCount + ' ' + t('running') + '</span>' : '') +
                '    </div>' +
                '  </div>' +
                '  <button type="button" id="export-btn" class="btn btn-export"' + (filtered.length === 0 ? ' disabled' : '') + '>' +
                '    <i data-lucide="download"></i> ' + t('exportBtn') +
                '  </button>' +
                '  <div class="hero-glow-rep"></div>' +
                '</div>';

            if (filtered.length === 0) {
                tableCard.innerHTML =
                    '<div class="report-empty"><div class="empty-state">' +
                    '  <i data-lucide="file-spreadsheet"></i>' +
                    '  <p class="empty-title">' + t('emptyReport') + '</p>' +
                    '  <p class="empty-sub">' + t('emptyReportSub') + '</p>' +
                    '</div></div>';
                refreshIcons();
                return;
            }

            var rows = '';
            getGroupedEntries(filtered).forEach(function (group) {
                var clientName = group[0];
                var clientTasks = group[1];
                var clientTotal = clientTasks.reduce(function (sum, t) { return sum + parseFloat(t.hours || 0); }, 0);

                rows +=
                    '<tr class="client-row">' +
                    '  <td colspan="5">' + esc(clientName) + '</td>' +
                    '  <td class="num client-total">&Sigma; ' + clientTotal.toFixed(1) + 'h</td>' +
                    '</tr>';

                clientTasks.forEach(function (e) {
                    var hours = parseFloat(e.hours || 0);
                    var d = new Date(e.date);
                    var dateLabel = isNaN(d) ? '-' : d.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', { day: '2-digit', month: '2-digit' });
                    rows +=
                        '<tr class="data-row">' +
                        '  <td class="cell-date">' + dateLabel + '</td>' +
                        '  <td class="cell-client">' + esc(e.client) + '</td>' +
                        '  <td class="cell-job">' + esc(e.jobTitle || '-') + '</td>' +
                        '  <td class="cell-task">' + esc(e.task) + '</td>' +
                        '  <td class="cell-assoc">' + esc(e.associates) + '</td>' +
                        '  <td class="num">' +
                        '    <div class="cell-hours' + (!e.endTime ? ' running' : '') + '">' + hours.toFixed(1) + 'h</div>' +
                        '    <div class="cell-times">' + (e.endTime ? esc(e.startTime) + ' – ' + esc(e.endTime) : (state.lang==='id'?'Mulai: ':'Start: ') + esc(e.startTime)) + '</div>' +
                        '  </td>' +
                        '</tr>';
                });
            });

            tableCard.innerHTML =
                '<div class="table-scroll">' +
                '  <table class="report-table">' +
                '    <thead><tr>' +
                '      <th>' + t('thDate') + '</th><th>' + t('thClient') + '</th><th>' + t('thJob') + '</th><th>' + t('thTask') + '</th><th>' + t('thAssoc') + '</th><th class="num">' + t('thTime') + '</th>' +
                '    </tr></thead>' +
                '    <tbody>' + rows + '</tbody>' +
                '  </table>' +
                '</div>' +
                '<div class="report-footer">' + t('endReport') + '</div>';
            refreshIcons();
        }

        function refreshDynamic() {
            renderEntryList();
            renderReport();
            updateStatusBar();
        }

        /* =====================================================
           Actions
           ===================================================== */
        function setSubmitting(on) {
            state.isSubmitting = on;
            var btn = $('#submit-btn');
            if (!btn) return;
            btn.disabled = on;
            btn.innerHTML = on
                ? '<span class="spinner"></span> ' + t('btnSaving')
                : '<i data-lucide="save"></i> ' + t('btnSave');
            refreshIcons();
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (state.isSubmitting) return;
            if (!state.user || !state.firebaseReady) {
                showInfoModal(t('errConnect'));
                return;
            }

            var client = $('#f-client').value.trim();
            var date = $('#f-date').value;
            var startTime = $('#f-start').value;
            var endTime = $('#f-end').value;
            var associates = $('#f-assoc').value.trim();
            var jobTitle = $('#f-job').value.trim();
            var task = $('#f-task').value.trim();

            var newEntry = {
                client: client.toUpperCase(),
                jobTitle: jobTitle,
                task: task,
                date: date,
                startTime: startTime,
                endTime: endTime || '', 
                hours: endTime ? calcHours(startTime, endTime) : 0,
                associates: associates || '-',
                author: state.userName,
                userId: state.user.uid,
                createdAt: new Date().toISOString()
            };

            setSubmitting(true);
            var fs = window.FirebaseServices;
            try {
                await fs.addDoc(fs.collection(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey)), newEntry);
                $('#f-client').value = '';
                $('#f-job').value = '';
                $('#f-task').value = '';
                $('#f-assoc').value = '';
                $('#f-end').value = '';
                $('#f-start').value = getCurrentTime();
                showToast(t('toastSaved'));
            } catch (err) {
                console.error('Submit Error:', err);
                showInfoModal(t('syncErr'));
            } finally {
                setSubmitting(false);
            }
        }

        function openFinishModal(entry) {
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="check-circle-2"></i></div>' +
                '<h4 class="modal-title">' + t('modalFinish') + '</h4>' +
                '<p class="modal-sub">' + esc(entry.jobTitle || entry.client) + '</p>' +
                '<div class="modal-fields">' +
                '  <div class="field">' +
                '    <label class="label">' + t('fDate') + '</label>' +
                '    <input id="fm-date" type="date" value="' + esc(entry.date) + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fStart') + '</label>' +
                '    <input id="fm-start" type="time" value="' + esc(entry.startTime) + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fEnd') + '</label>' +
                '    <input id="fm-end" type="time" class="input-optional" value="' + getCurrentTime() + '">' +
                '  </div>' +
                '  <p class="modal-hint">' + t('modalHint') + '</p>' +
                '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-save>' + t('btnSave') + '</button>' +
                '</div>'
            );

            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-save]').addEventListener('click', async function () {
                var date = overlay.querySelector('#fm-date').value;
                var startTime = overlay.querySelector('#fm-start').value;
                var endTime = overlay.querySelector('#fm-end').value;
                if (!date || !startTime || !endTime) {
                    showInfoModal(t('errIncomplete'));
                    return;
                }

                var calculatedHours = calcHours(startTime, endTime);
                // Adjust if cross midnight (simple heuristic)
                if (endTime < startTime) {
                    var start = new Date(date + 'T' + startTime + ':00');
                    var nextDay = new Date(start);
                    nextDay.setDate(nextDay.getDate() + 1);
                    var end = new Date(nextDay.toISOString().split('T')[0] + 'T' + endTime + ':00');
                    calculatedHours = (end - start) / 3600000;
                }

                var fs = window.FirebaseServices;
                try {
                    var docRef = fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), entry.id);
                    await fs.updateDoc(docRef, {
                        date: date,
                        startTime: startTime,
                        endTime: endTime,
                        hours: parseFloat(calculatedHours.toFixed(2))
                    });
                    closeModal(overlay);
                    showToast(t('toastFinished'));
                } catch (err) {
                    console.error(err);
                    showInfoModal(t('syncErr'));
                }
            });
        }

        function openEditModal(entry) {
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="pencil-line"></i></div>' +
                '<h4 class="modal-title">' + t('modalEdit') + '</h4>' +
                '<div class="modal-fields">' +
                '  <div class="field">' +
                '    <label class="label">' + t('fClient') + '</label>' +
                '    <input id="me-client" type="text" value="' + esc(entry.client) + '">' +
                '  </div>' +
                '  <div class="field-row">' +
                '    <div class="field"><label class="label">' + t('fDate') + '</label><input id="me-date" type="date" value="' + esc(entry.date) + '"></div>' +
                '    <div class="field"><label class="label">' + t('fAssoc') + '</label><input id="me-assoc" type="text" value="' + esc(entry.associates) + '"></div>' +
                '  </div>' +
                '  <div class="field-row">' +
                '    <div class="field"><label class="label">' + t('fStart') + '</label><input id="me-start" type="time" value="' + esc(entry.startTime) + '"></div>' +
                '    <div class="field"><label class="label">' + t('fEnd') + '</label><input id="me-end" type="time" class="' + (!entry.endTime ? 'input-optional' : '') + '" value="' + esc(entry.endTime || '') + '"></div>' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fJob') + '</label>' +
                '    <input id="me-job" type="text" value="' + esc(entry.jobTitle || '') + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fTask') + '</label>' +
                '    <textarea id="me-task">' + esc(entry.task) + '</textarea>' +
                '  </div>' +
                '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-save>' + t('btnSave') + '</button>' +
                '</div>'
            );

            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-save]').addEventListener('click', async function () {
                var client = overlay.querySelector('#me-client').value.trim();
                var date = overlay.querySelector('#me-date').value;
                var associates = overlay.querySelector('#me-assoc').value.trim();
                var startTime = overlay.querySelector('#me-start').value;
                var endTime = overlay.querySelector('#me-end').value;
                var jobTitle = overlay.querySelector('#me-job').value.trim();
                var task = overlay.querySelector('#me-task').value.trim();

                if (!client || !date || !startTime || !jobTitle || !task) {
                    showInfoModal(state.lang==='id'?'Mohon lengkapi field yang wajib.':'Please complete required fields.');
                    return;
                }

                var calculatedHours = 0;
                if (endTime) {
                    calculatedHours = calcHours(startTime, endTime);
                    if (endTime < startTime) {
                        var start = new Date(date + 'T' + startTime + ':00');
                        var nextDay = new Date(start);
                        nextDay.setDate(nextDay.getDate() + 1);
                        var end = new Date(nextDay.toISOString().split('T')[0] + 'T' + endTime + ':00');
                        calculatedHours = (end - start) / 3600000;
                    }
                }

                var fs = window.FirebaseServices;
                try {
                    var docRef = fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), entry.id);
                    await fs.updateDoc(docRef, {
                        client: client.toUpperCase(),
                        date: date,
                        associates: associates || '-',
                        startTime: startTime,
                        endTime: endTime || '',
                        jobTitle: jobTitle,
                        task: task,
                        hours: parseFloat(calculatedHours.toFixed(2))
                    });
                    closeModal(overlay);
                    showToast(t('toastUpdated'));
                } catch (err) {
                    console.error(err);
                    showInfoModal(t('syncErr'));
                }
            });
        }

        function handleDelete(id) {
            showConfirm(t('modalDeleteTxt'), t('modalDeleteBtn'), async function () {
                var fs = window.FirebaseServices;
                try {
                    await fs.deleteDoc(fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), id));
                    showToast(t('toastDeleted'), 'trash-2');
                } catch (err) {
                    showInfoModal(t('syncErr'));
                }
            });
        }

        function handleLogout() {
            showConfirm(t('modalLogoutTxt'), t('modalLogoutBtn'), function () {
                localStorage.removeItem('woker_access_key');
                localStorage.removeItem('woker_user_name');
                if (state.unsubscribe) { state.unsubscribe(); state.unsubscribe = null; }
                state.subscribedKey = null;
                state.isLoggedIn = false;
                state.accessKey = '';
                state.userName = '';
                state.entries = [];
                state.hasLoadedOnce = false;
                state.activeTab = 'input';
                render();
            });
        }

        /* ---------- Excel export (Multi-Month) ---------- */
        function exportExcel() {
            if (state.entries.length === 0) {
                showToast(t('exportEmpty'), 'alert-circle');
                return;
            }

            // Group strictly by YYYY-MM
            var grouped = {};
            state.entries.forEach(function(e) {
                var d = new Date(e.date);
                if (isNaN(d)) return;
                var k = d.getFullYear() + '-' + String(d.getMonth()).padStart(2, '0');
                if (!grouped[k]) grouped[k] = { entries: [], month: d.getMonth(), year: d.getFullYear() };
                grouped[k].entries.push(e);
            });

            var keys = Object.keys(grouped).sort(function(a, b) { return b.localeCompare(a); });
            if (keys.length === 0) {
                showToast(t('exportEmpty'), 'alert-circle');
                return;
            }

            var wb = XLSX.utils.book_new();

            keys.forEach(function(k) {
                var group = grouped[k];
                var monthNameIndo = i18n['id'].months[group.month]; 
                var sheetName = monthNameIndo + ' ' + group.year;
                var totalHours = getTotalHours(group.entries);
                var safeUserName = state.userName || 'User';

                var wsData = [
                    ["TIMESHEET REPORT"],
                    ["NAMA", ":", safeUserName],
                    ["BULAN", ":", sheetName],
                    ["KODE ID", ":", state.accessKey],
                    [],
                    ["TANGGAL", "KLIEN", "PEKERJAAN", "DETAIL PEKERJAAN", "ASSOCIATES", "WAKTU MULAI", "WAKTU SELESAI", "DURASI (JAM)"]
                ];

                var sortedEntries = group.entries.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

                sortedEntries.forEach(function(e) {
                    wsData.push([
                        e.date,
                        e.client,
                        e.jobTitle || '-',
                        e.task,
                        e.associates || '-',
                        e.startTime || '-',
                        e.endTime || 'Masih Berjalan',
                        e.hours
                    ]);
                });

                wsData.push([]);
                wsData.push(["", "", "", "", "", "", "TOTAL JAM", totalHours.toFixed(1)]);

                var ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [
                    { wch: 12 }, { wch: 25 }, { wch: 25 }, { wch: 50 }, { wch: 20 }, { wch: 15 }, { wch: 15 }, { wch: 15 }
                ];
                
                // Keep sheetName under 31 characters limit of Excel
                XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31));
            });

            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            var safeUserName = state.userName || 'User';
            var fileName = yyyy + '.' + mm + '.' + dd + ' - [TIMESHEET] ' + safeUserName + '.xlsx';

            XLSX.writeFile(wb, fileName);
            showToast(t('exportSuccess'), 'download');
        }

        /* =====================================================
           Router + init
           ===================================================== */
        function render() {
            if (!state.isLoggedIn) { renderLogin(); return; }
            if (!state.userName) { renderName(); return; }
            renderApp();
        }

        render();
        bootFirebase();
    })();
    </script>
