<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111845">
    
    <!-- 1. Judul Website -->
    <title>Woker</title>

    <!-- 2. Pengaturan Icon dan iOS Web App (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Woker">
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <link rel="apple-touch-icon" href="favicon.png?v=3">
    <link rel="shortcut icon" href="favicon.png?v=3">

    <!-- Libraries: spreadsheet export + icon set -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Pre-load Dark Theme Script to avoid flash -->
    <script>
        if (localStorage.getItem('woker_dark') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        /* =====================================================
           WOKER DESIGN TOKENS
           ===================================================== */
        :root {
            /* Brand palette - LIGHT MODE: navy / indigo / blue-grey / white */
            --navy-950: #0b0f30;
            --navy-900: #111845;
            --navy-800: #1a2258;
            --navy-700: #232d6b;
            --navy-600: #2e3a7e;
            --navy-500: #3a4791;

            --accent: #4a5695;
            --accent-soft: #edeff7;
            --accent-border: #c3cae4;
            --focus-ring: rgba(74, 86, 149, 0.15);
            --accent-ring: rgba(74, 86, 149, 0.3);
            --accent-tint: rgba(74, 86, 149, 0.06);

            /* Neutral surfaces & text - LIGHT MODE (Default) */
            --bg: #f4f6fa;
            --card: #ffffff;
            --surface: #eef1f7;
            --border: #d9dfec;
            --border-light: #e8ecf4;
            --text: #111845;
            --text-soft: #3d4577;
            --text-muted: #7187b2;
            --text-faint: #c0cade;

            /* Semantic colors */
            --success: #10b981;
            --info: #3b82f6;
            --warning: #f97316;
            --warning-soft: #fff7ed;
            --warning-border: #fed7aa;
            --danger: #ef4444;
            --danger-soft: #fef2f2;

            /* Spacing scale */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

            /* Radii */
            --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
            --r-xl: 28px; --r-2xl: 36px; --r-pill: 999px;

            /* Elevation */
            --shadow-sm: 0 1px 3px rgb(17 24 69 / .06);
            --shadow-md: 0 4px 20px -5px rgb(17 24 69 / .12);
            --shadow-lg: 0 20px 50px -20px rgb(17 24 69 / .35);
            --shadow-2xl: 0 25px 50px -12px rgb(17 24 69 / .25);

            /* Typography */
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --track: .18em;

            --ease: cubic-bezier(.4, 0, .2, 1);
        }

        /* DARK MODE OVERRIDES - Premium, rich dark indigo palette */
        [data-theme="dark"] {
            /* Brand palette - DARK MODE: deep navy-black / dark indigo / slate blue / periwinkle
               Wider lightness steps than before so card/surface/border read as distinct layers
               instead of blending into the near-black background. Hue family unchanged. */
            --bg: #05060f;
            --card: #0c1130;
            --surface: #171c44;
            --border: #333b74;
            --border-light: #1e2350;
            --text: #f8f9fd;
            --text-soft: #d3d6f0;
            --text-muted: #9598cf;
            --text-faint: #565e98;

            --navy-950: #030410;
            --navy-900: #0e1230;
            --navy-800: #171c44;
            --navy-700: #1f254f;
            --navy-600: #2b3268;
            --navy-500: #3a4390;

            --accent: #adabe6;
            --accent-soft: rgba(173, 171, 230, 0.16);
            --accent-border: rgba(173, 171, 230, 0.34);
            --focus-ring: rgba(173, 171, 230, 0.22);
            --accent-ring: rgba(173, 171, 230, 0.4);
            --accent-tint: rgba(173, 171, 230, 0.07);

            --warning-soft: rgba(249, 115, 22, 0.15);
            --warning-border: rgba(249, 115, 22, 0.3);
            
            --danger-soft: rgba(239, 68, 68, 0.15);

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 20px -5px rgba(0,0,0,0.6);
            --shadow-lg: 0 20px 50px -20px rgba(0,0,0,0.7);
            --shadow-2xl: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        /* ---------- Base ---------- */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s var(--ease), color 0.3s var(--ease);
        }
        input, textarea, select, button { font-family: var(--font); font-size: 16px; }
        img, svg { display: block; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: var(--r-pill); }

        .lucide { width: 1em; height: 1em; stroke-width: 2.4; }

        /* ---------- Shared text styles ---------- */
        .label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: var(--track);
            color: var(--text-muted);
            margin: 0 0 var(--sp-1) var(--sp-1);
        }
        
        /* New Logo Component Styles */
        .brand-icon {
            display: block;
            object-fit: contain;
            margin: 0 auto;
            /* Tile navy agar logo W putih selalu kontras di tema terang maupun gelap.
               Padding harus px (bukan %) karena % pada img mengacu ke lebar parent. */
            padding: 9px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-950));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            border-radius: 22%;
        }
        .brand-text {
            margin: 0;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1;
            color: #fff;
            text-align: center;
        }

        /* ---------- Inputs ---------- */
        .field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
        .field input, .field textarea {
            width: 100%;
            padding: 14px var(--sp-4);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-weight: 700;
            color: var(--text);
            outline: none;
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
            appearance: none;
            -webkit-appearance: none;
        }
        .field input::placeholder, .field textarea::placeholder { color: var(--text-faint); font-weight: 600; }
        .field input:focus, .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        .field textarea { min-height: 120px; resize: vertical; font-weight: 500; line-height: 1.6; }
        .input-optional { background: var(--accent-soft) !important; border-color: var(--accent-border) !important; color: var(--accent) !important; }
        .hint-optional { margin: 2px 0 0 var(--sp-1); font-size: 9px; font-weight: 800; font-style: italic; color: var(--warning); }
        .field-row { display: flex; gap: var(--sp-4); }
        .field-row .field { flex: 1; }
        .track-toggle {
            display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer;
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: var(--track);
            color: var(--text-muted); user-select: none; margin-left: var(--sp-1);
        }
        .track-toggle input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
        @media (max-width: 480px) { .field-row { flex-direction: column; } }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
            border: none;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: var(--track);
            font-size: 11px;
            padding: var(--sp-4) var(--sp-6);
            border-radius: var(--r-md);
            transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
            user-select: none;
        }
        .btn:active { transform: scale(.97); }
        .btn:disabled { cursor: not-allowed; transform: none; }
        .btn .lucide { font-size: 15px; }

        .btn-primary { background: var(--navy-900); color: #fff; box-shadow: var(--shadow-md); }
        .btn-primary:hover { background: var(--navy-800); }
        .btn-primary:disabled { background: var(--border-light); color: var(--text-faint); box-shadow: none; }
        [data-theme="dark"] .btn-primary { background: #5865ad; }
        [data-theme="dark"] .btn-primary:hover { background: #6975c2; }
        [data-theme="dark"] .btn-primary:disabled { background: var(--surface); }

        .btn-ghost { background: var(--border-light); color: var(--text-soft); }
        .btn-ghost:hover { background: var(--border); }

        .btn-danger { background: var(--danger); color: #fff; box-shadow: var(--shadow-md); }
        .btn-danger:hover { background: #dc2626; }

        .btn-block { width: 100%; padding-top: 18px; padding-bottom: 18px; }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--sp-2);
            border-radius: var(--r-sm);
            color: var(--text-faint);
            transition: color .2s var(--ease), background .2s var(--ease);
        }
        .icon-btn .lucide { font-size: 18px; }

        .spinner {
            width: 15px; height: 15px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Cards ---------- */
        .card {
            background: var(--card);
            border: 1px solid var(--border-light);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-md);
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
        }

        /* =====================================================
           AUTH SCREENS (Redesigned Split Layout)
           ===================================================== */
        .auth-split { display: flex; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
        .auth-brand { 
            flex: 1; 
            background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 100%); 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            padding: var(--sp-10); 
            position: relative; 
            overflow: hidden; 
        }
        @media(min-width: 900px) { .auth-brand { display: flex; } }
        
        .auth-brand-inner { position: relative; z-index: 2; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
        /* Menambah ukuran logo di desktop login agar lebih jelas dan menyesuaikan bayangannya */
        .auth-brand-inner .brand-icon { width: 120px; height: 120px; padding: 22px; margin: 0 auto 24px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.3); }
        .auth-brand-inner .brand-text { font-size: 56px; }
        
        .auth-glow { 
            position: absolute; width: 600px; height: 600px; 
            background: var(--accent); filter: blur(160px); 
            opacity: 0.15; border-radius: 50%; 
            bottom: -200px; left: -100px; pointer-events: none; 
        }
        .auth-pattern {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4; pointer-events: none;
        }
        
        .auth-form-wrap { 
            flex: 1; max-width: 650px; width: 100%; margin: 0 auto;
            display: flex; flex-direction: column; justify-content: center; 
            background: var(--card); position: relative; 
            box-shadow: -20px 0 50px rgba(0,0,0,0.1); 
            padding: calc(var(--sp-10) + env(safe-area-inset-top)) var(--sp-6) var(--sp-10);
        }
        [data-theme="dark"] .auth-form-wrap { box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
        .auth-top-bar { position: absolute; top: calc(var(--sp-6) + env(safe-area-inset-top)); right: var(--sp-8); display: flex; gap: var(--sp-2); }
        
        .auth-body { max-width: 400px; width: 100%; margin: 0 auto; }
        
        /* Menambah ukuran logo di mobile login agar lebih jelas */
        .mobile-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .mobile-brand .brand-icon { width: 80px; height: 80px; padding: 15px; margin-bottom: 12px; }
        .mobile-brand .brand-text { color: var(--navy-900); font-size: 32px; }
        [data-theme="dark"] .mobile-brand .brand-text { color: #fff; }
        @media(min-width: 900px) { .mobile-brand { display: none; } }

        .auth-title {
            margin: 0 0 var(--sp-2); font-size: 32px; font-weight: 900;
            text-transform: uppercase; letter-spacing: -.03em; color: var(--text);
        }
        .auth-sub { margin: 0 0 var(--sp-10); font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.5; }
        
        .auth-form { display: flex; flex-direction: column; gap: var(--sp-6); }
        .code-input {
            width: 100%; padding: var(--sp-5); background: var(--surface);
            border: 2px solid var(--border-light); border-radius: var(--r-lg);
            outline: none; font-size: 24px; font-weight: 900; text-align: center;
            text-transform: uppercase; letter-spacing: .25em; color: var(--text);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            transition: border-color .2s var(--ease), background .2s var(--ease);
        }
        .code-input:focus { border-color: var(--accent); }
        .code-input.invalid { border-color: var(--danger); }
        .remember {
            display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
            cursor: pointer; font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: var(--track); color: var(--text-muted);
        }
        .remember input { width: 18px; height: 18px; accent-color: var(--accent); }
        .auth-note {
            margin: var(--sp-6) 0 0; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .1em; line-height: 1.8;
            text-align: center; color: var(--text-faint);
        }

        .lang-toggle-btn {
            background: var(--surface); color: var(--text-soft);
            border: 1px solid var(--border); border-radius: var(--r-pill);
            padding: 6px 14px; font-size: 10px; font-weight: 900;
            cursor: pointer; transition: all 0.2s var(--ease);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .lang-toggle-btn:hover { background: var(--border-light); color: var(--text); }
        .lang-toggle-btn .lucide { font-size: 12px; }

        /* =====================================================
           APP SHELL & HEADER (Redesigned Alignment)
           ===================================================== */
        .app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

        .app-header {
            background: var(--navy-900);
            border-bottom: 1px solid var(--navy-600);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 50;
            padding-top: env(safe-area-inset-top);
        }
        .header-inner {
            max-width: 1320px;
            margin: 0 auto;
            padding: var(--sp-4) var(--sp-6);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto;
            row-gap: var(--sp-5);
            align-items: center;
        }
        .header-inner .brand {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        /* Menambah ukuran logo di header mobile dan menyesuaikan bayangan */
        .header-inner .brand-icon {
            width: 42px; height: 42px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
        .header-inner .brand-text {
            font-size: 15px;
        }
        
        .header-actions {
            grid-column: 3;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: var(--sp-1);
        }
        
        .month-nav {
            grid-column: 1 / -1;
            grid-row: 2;
            justify-self: center;
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            background: var(--navy-800);
            border: 1px solid var(--navy-600);
            border-radius: var(--r-pill);
            padding: 6px var(--sp-3);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
        }
        .month-btn {
            background: none; border: none; cursor: pointer;
            color: #fff; padding: var(--sp-2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s var(--ease), color .2s var(--ease);
        }
        .month-btn:hover { background: rgba(255,255,255,0.1); color: var(--info); }
        .month-btn .lucide { font-size: 18px; }
        .month-label { text-align: center; min-width: 130px; line-height: 1.2; }
        .month-name {
            display: block; color: #fff; font-size: 14px;
            font-weight: 900; text-transform: uppercase; letter-spacing: var(--track);
        }
        .month-year { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        .top-action-btn { color: #fff; opacity: 0.7; }
        .top-action-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .top-action-btn.logout-top:hover { color: #fca5a5; background: rgba(239,68,68,0.18); }

        @media (min-width: 768px) {
            .header-inner {
                padding: var(--sp-5) var(--sp-8);
                grid-template-columns: 1fr auto 1fr;
                grid-template-rows: auto;
                row-gap: 0;
            }
            .header-inner .brand {
                grid-column: 2;
                gap: 8px;
            }
            /* Menambah ukuran logo di header desktop dan menghilangkan bayangan di header desktop agar lebih bersih */
            .header-inner .brand-icon { width: 50px; height: 50px; box-shadow: none; }
            .header-inner .brand-text { font-size: 18px; }
            
            .month-nav { grid-column: 1; grid-row: 1; justify-self: start; }
            .header-actions { grid-column: 3; grid-row: 1; justify-self: end; position: static; }
        }

        .app-main { width: 100%; max-width: 1320px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) 0; }
        @media (min-width: 768px) { .app-main { padding: var(--sp-8) var(--sp-8) 0; } }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
            background: var(--card); border: 1px solid var(--border-light);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            padding: var(--sp-3) var(--sp-5); margin-bottom: var(--sp-6);
            font-size: 11px; font-weight: 900; text-transform: uppercase;
            letter-spacing: .12em; overflow: hidden;
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
        }
        .status-left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .sync-dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .sync-dot.busy { background: var(--info); animation: pulse 1.4s ease-in-out infinite; }
        .sync-dot.error { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
        @keyframes pulse { 50% { opacity: .35; } }
        .status-name { color: var(--text); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-name .lucide { font-size: 13px; color: var(--text-muted); }
        .status-sep { color: var(--border); }
        .status-id { color: var(--text-muted); white-space: nowrap; }
        @media (max-width: 560px) { .status-sep, .status-id { display: none; } }
        .btn-logout {
            display: inline-flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer; color: var(--danger);
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em;
            padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
            transition: background .2s var(--ease); flex-shrink: 0;
        }
        .btn-logout:hover { background: var(--danger-soft); }
        .btn-logout .lucide { font-size: 13px; }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex; background: var(--card); border: 1px solid var(--border-light);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            padding: var(--sp-1); margin-bottom: var(--sp-8);
        }
        .tab-btn {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
            border: none; background: none; cursor: pointer; padding: var(--sp-3) var(--sp-4);
            border-radius: var(--r-md); font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: var(--track); color: var(--text-muted);
            transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
        }
        .tab-btn .lucide { font-size: 14px; }
        .tab-btn.active { background: var(--navy-900); color: #fff; box-shadow: var(--shadow-md); }
        [data-theme="dark"] .tab-btn.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        /* =====================================================

        var t = function(key, vars) {
            var str = i18n[state.lang][key] || key;
            if (vars) {
                for (var k in vars) { str = str.replace('{' + k + '}', vars[k]); }
            }
            return str;
        };

        /* =====================================================
           Helpers
           ===================================================== */
        var $ = function(sel, el) { return (el || document).querySelector(sel); };

        var esc = function(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        };

        var getCurrentTime = function() { return new Date().toTimeString().slice(0, 5); };
        var getToday = function() { return new Date().toISOString().split('T')[0]; };

        var safeCollectionKey = function(key) {
            return 'data_' + key.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
        };

        var calcHours = function(startTime, endTime) {
            if (!startTime || !endTime) return 0;
            var start = new Date('1970-01-01T' + startTime + ':00');
            var end = new Date('1970-01-01T' + endTime + ':00');
            var diff = end - start;
            if (diff < 0) diff += 24 * 60 * 60 * 1000;
            return parseFloat((diff / 3600000).toFixed(2));
        };

        var refreshIcons = function() { if (window.lucide) window.lucide.createIcons(); };

        /* =====================================================
           State
           ===================================================== */
        var state = {
            user: null,
            firebaseReady: false,
            authStarted: false,
            cloudError: false,
            isCloudSyncing: false,
            hasLoadedOnce: false,
            unsubscribe: null,
            subscribedKey: null,

            isLoggedIn: !!localStorage.getItem('woker_access_key'),
            accessKey: localStorage.getItem('woker_access_key') || '',
            userName: localStorage.getItem('woker_user_name') || '',
            lang: localStorage.getItem('woker_lang') || 'en',
            dark: localStorage.getItem('woker_dark') === 'true',

            entries: [],
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            activeTab: 'input',
            isSubmitting: false
        };

        var root = document.getElementById('root');

        /* =====================================================
           Derived data
           ===================================================== */
        var getFilteredEntries = function() {
            return state.entries.filter(function (e) {
                var d = new Date(e.date);
                return d.getMonth() === state.currentMonth && d.getFullYear() === state.currentYear;
            }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
        };

        var getGroupedEntries = function(filtered) {
            var groups = {};
            filtered.forEach(function (entry) {
                if (!groups[entry.client]) groups[entry.client] = [];
                groups[entry.client].push(entry);
            });
            return Object.entries(groups).sort(function (a, b) { return a[0].localeCompare(b[0]); });
        };

        var getTotalHours = function(filtered) {
            return filtered.reduce(function (sum, e) { return sum + parseFloat(e.hours || 0); }, 0);
        };

        var getRunningEntries = function() {
            return state.entries.filter(function (e) { return !e.endTime && !e.noTime; });
        };

            state.dark = !state.dark;

                document.documentElement.setAttribute('data-theme', 'dark');

            }

        /* =====================================================
           Toast & modal primitives
           ===================================================== */
        var showToast = function(message, icon) {
            var rootEl = $('#toast-root');
            if (!rootEl) {
                rootEl = document.createElement('div');
                rootEl.id = 'toast-root';
                document.body.appendChild(rootEl);
            }
            var toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = '<i data-lucide="' + (icon || 'check-circle-2') + '"></i><span>' + esc(message) + '</span>';
            rootEl.appendChild(toast);
            refreshIcons();
            requestAnimationFrame(function () { toast.classList.add('show'); });
            setTimeout(function () {
                toast.classList.remove('show');
                setTimeout(function () { toast.remove(); }, 300);
            }, 2600);
        };

        var openModal = function(innerHTML, dismissible) {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = '<div class="modal-panel">' + innerHTML + '</div>';
            if (dismissible) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeModal(overlay);
                });
            }
            document.body.appendChild(overlay);
            refreshIcons();
            requestAnimationFrame(function () { overlay.classList.add('open'); });
            return overlay;
        };

        var closeModal = function(overlay) {
            overlay.classList.remove('open');
            setTimeout(function () { overlay.remove(); }, 200);
        };

        var showInfoModal = function(message, customTitle) {
            var title = customTitle || 'Info';
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="info"></i></div>' +
                '<h4 class="modal-title">' + esc(title) + '</h4>' +
                '<p class="modal-sub">' + esc(message) + '</p>' +
                '<button class="btn btn-primary btn-block" data-modal-close>' + (state.lang==='id'?'Tutup':'Close') + '</button>',
                true
            );
            overlay.querySelector('[data-modal-close]').addEventListener('click', function () { closeModal(overlay); });
        };

        var showConfirm = function(message, confirmBtnText, onConfirm) {
            var overlay = openModal(
                '<div class="modal-icon danger"><i data-lucide="alert-triangle"></i></div>' +
                '<h4 class="modal-title">' + t('modalConfirm') + '</h4>' +
                '<p class="modal-sub">' + esc(message) + '</p>' +
                '<div class="modal-actions">' +
                '  <button class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button class="btn btn-danger" data-modal-ok>' + confirmBtnText + '</button>' +
                '</div>'
            );
            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-ok]').addEventListener('click', function () {
                closeModal(overlay);
                onConfirm();
            });
        };

        /* =====================================================
           Firebase: auth bootstrap + Firestore subscription
           ===================================================== */
        var bootFirebase = function() {
            if (window.FirebaseServices) { setupAuth(); return; }
            var onReady = function () { setupAuth(); };
            window.addEventListener('firebase-ready', onReady, { once: true });
            var interval = setInterval(function () {
                if (window.FirebaseServices) {
                    clearInterval(interval);
                    window.removeEventListener('firebase-ready', onReady);
                    setupAuth();
                } else if (window.FirebaseSetupError) {
                    clearInterval(interval);
                    window.removeEventListener('firebase-ready', onReady);
                    state.cloudError = true;
                    showInfoModal(window.FirebaseSetupError);
                    updateConnectionUI();
                }
            }, 200);
        };

        var setupAuth = async function() {
            if (state.authStarted) return;
            state.authStarted = true;
            var fs = window.FirebaseServices;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await fs.signInWithCustomToken(fs.auth, __initial_auth_token);
                } else {
                    await fs.signInAnonymously(fs.auth);
                }
                fs.onAuthStateChanged(fs.auth, function (u) {
                    state.user = u;
                    state.firebaseReady = true;
                    updateConnectionUI();
                    ensureSubscription();
                });
            } catch (error) {
                console.error('Auth Error:', error);
                state.cloudError = true;
                showInfoModal(state.lang === 'id' ? 'Gagal masuk ke layanan Cloud.' : 'Failed to sign in to Cloud services.');
                updateConnectionUI();
            }
        };

        var ensureSubscription = function() {
            if (!state.firebaseReady || !state.user || !state.isLoggedIn ||
                !state.accessKey || !state.userName || !window.FirebaseServices) return;

            var key = safeCollectionKey(state.accessKey);
            if (state.subscribedKey === key) return;
            if (state.unsubscribe) { state.unsubscribe(); state.unsubscribe = null; }

            state.subscribedKey = key;
            state.isCloudSyncing = true;

            var fs = window.FirebaseServices;
            var colRef = fs.collection(fs.db, 'artifacts', fs.appId, 'public', 'data', key);
            state.unsubscribe = fs.onSnapshot(colRef, function (snapshot) {
                state.entries = snapshot.docs.map(function (d) {
                    return Object.assign({ id: d.id }, d.data());
                });
                state.isCloudSyncing = false;
                state.cloudError = false;
                state.hasLoadedOnce = true;
                refreshDynamic();
                updateConnectionUI();
            }, function (error) {
                console.error('Firestore Error:', error);
                state.cloudError = true;
                state.isCloudSyncing = false;
                state.hasLoadedOnce = true;
                showInfoModal(state.lang === 'id' ? "Gagal membaca data dari Cloud." : "Failed to read data from Cloud.");
                refreshDynamic();
                updateConnectionUI();
            });
        };

        var bindAppEvents = function() {
            $('#app-theme-toggle').addEventListener('click', toggleTheme);
            $('#app-lang-toggle').addEventListener('click', toggleLang);

            $('#prev-month').addEventListener('click', function () {
                if (state.currentMonth === 0) { state.currentMonth = 11; state.currentYear--; }
                else { state.currentMonth--; }
                updateMonthLabel();
                refreshDynamic();
            });
            $('#next-month').addEventListener('click', function () {
                if (state.currentMonth === 11) { state.currentMonth = 0; state.currentYear++; }
                else { state.currentMonth++; }
                updateMonthLabel();
                refreshDynamic();
            });

            $('#tab-btn-input').addEventListener('click', function () { setActiveTab('input'); });
            $('#tab-btn-rekap').addEventListener('click', function () { setActiveTab('rekap'); });

            $('#logout-btn-top').addEventListener('click', function () { handleLogout(); });

            $('#entry-form').addEventListener('submit', handleSubmit);

            $('#f-track').addEventListener('change', function () {
                var track = $('#f-track').checked;
                $('#time-fields').hidden = !track;
                $('#f-start').required = track;
            });

            $('#finish-all-btn').addEventListener('click', handleFinishAll);

            $('#import-btn').addEventListener('click', function () { $('#import-file').click(); });
            $('#import-file').addEventListener('change', function (e) {
                var file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (file) handleImportFile(file);
            });

            $('#entry-list').addEventListener('click', function (e) {
                var finishBtn = e.target.closest('[data-action="finish"]');
                var editBtn = e.target.closest('[data-action="edit"]');
                var delBtn = e.target.closest('[data-action="delete"]');
                
                if (finishBtn) {
                    var entry = state.entries.find(function (x) { return x.id === finishBtn.dataset.id; });
                    if (entry) openFinishModal(entry);
                    return;
                }
                if (editBtn) {
                    var entryEdit = state.entries.find(function (x) { return x.id === editBtn.dataset.id; });
                    if (entryEdit) openEditModal(entryEdit);
                    return;
                }
                if (delBtn) handleDelete(delBtn.dataset.id);
            });

            $('#tab-rekap').addEventListener('click', function (e) {
                if (e.target.closest('#export-btn')) exportExcel();
            });
        };

        var setActiveTab = function(tab) {
            state.activeTab = tab;
            $('#tab-input').hidden = tab !== 'input';
            $('#tab-rekap').hidden = tab !== 'rekap';
            $('#tab-btn-input').classList.toggle('active', tab === 'input');
            $('#tab-btn-rekap').classList.toggle('active', tab === 'rekap');

        var updateMonthLabel = function() {

            $('#month-year').textContent = state.currentYear;
        };

        var updateConnectionUI = function() {
            var el = $('#form-status');
            if (el) {
                if (state.cloudError) {
                    el.textContent = t('syncErr');
                    el.className = 'form-status is-error';
                } else if (!state.firebaseReady || (!state.user && state.authStarted)) {
                    el.textContent = t('syncBusy');
                    el.className = 'form-status is-loading';
                } else {
                    el.textContent = '';
                    el.className = 'form-status';
                }
            }
        };

        /* ---------- Entry list ---------- */
        var entryCardHTML = function(entry) {
            var d = new Date(entry.date);
            var day = isNaN(d) ? '?' : d.getDate();
            var weekday = isNaN(d) ? '' : d.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', { weekday: 'short' });
            var running = !entry.endTime && !entry.noTime;

            var statusHTML;
            if (entry.noTime) {
                statusHTML = '<span class="badge badge-time"><i data-lucide="timer-off"></i>' + t('badgeNoTime') + '</span>';
            } else if (running) {
                statusHTML = '<span class="badge badge-running"><span class="run-dot"></span>' + t('badgeRun', { time: esc(entry.startTime) }) + '</span>' +
                  '<button type="button" class="btn-finish" data-action="finish" data-id="' + esc(entry.id) + '">' +
                  '<i data-lucide="check-circle-2"></i>' + t('btnFinish') + '</button>';
            } else {
                statusHTML = '<span class="badge badge-time"><i data-lucide="clock"></i>' +
                  t('badgeTime', { start: esc(entry.startTime), end: esc(entry.endTime), hours: esc(entry.hours) }) + '</span>';
            }

            return (
                '<article class="entry-card' + (running ? ' is-running' : '') + '">' +
                '  <div class="date-badge">' +
                '    <span class="date-day">' + day + '</span>' +
                '    <span class="date-weekday">' + esc(weekday) + '</span>' +
                '  </div>' +
                '  <div class="entry-body">' +
                '    <div class="entry-top">' +
                '      <span class="entry-client">' + esc(entry.client) + '</span>' +
                       statusHTML +
                '    </div>' +
                     (entry.jobTitle ? '<p class="entry-job">' + esc(entry.jobTitle) + '</p>' : '') +
                '    <p class="entry-task">' + esc(entry.task) + '</p>' +
                '    <p class="entry-assoc"><i data-lucide="users"></i>Associates: ' + esc(entry.associates) + '</p>' +
                '  </div>' +
                '  <div class="entry-actions">' +
                '    <button type="button" class="icon-btn edit-btn" data-action="edit" data-id="' + esc(entry.id) + '">' +
                '      <i data-lucide="pencil-line"></i>' +
                '    </button>' +
                '    <button type="button" class="icon-btn delete-btn" data-action="delete" data-id="' + esc(entry.id) + '">' +
                '      <i data-lucide="trash-2"></i>' +
                '    </button>' +
                '  </div>' +
                '</article>'

        var renderEntryList = function() {
            var listEl = $('#entry-list');
            if (!listEl) return;
            var filtered = getFilteredEntries();
            $('#entry-count').textContent = filtered.length + ' ' + t('itemCount');

            var finishAllBtn = $('#finish-all-btn');
            if (finishAllBtn) finishAllBtn.hidden = getRunningEntries().length === 0;

            if (!state.hasLoadedOnce && !state.cloudError) {
                var skeleton =
                    '<div class="skeleton-card"><div class="sk sk-badge"></div><div class="sk-lines">' +
                    '<div class="sk sk-line w-40"></div><div class="sk sk-line w-90"></div><div class="sk sk-line w-70"></div>' +
                    '</div></div>';
                listEl.innerHTML = skeleton + skeleton + skeleton;
                return;
            }

            if (filtered.length === 0) {
                listEl.innerHTML =
                    '<div class="empty-state">' +
                    '  <i data-lucide="inbox"></i>' +
                    '  <p class="empty-title">' + t('emptyData') + '</p>' +
                    '  <p class="empty-sub">' + t('emptyDataSub', { month: i18n[state.lang].months[state.currentMonth], year: state.currentYear }) + '</p>' +
                    '</div>';
                refreshIcons();
                return;

            listEl.innerHTML = filtered.map(entryCardHTML).join('');

        };

        /* ---------- Report tab ---------- */
        var renderReport = function() {
            var hero = $('#report-hero');
            var tableCard = $('#report-table');
            if (!hero || !tableCard) return;

            var filtered = getFilteredEntries();
            var total = getTotalHours(filtered);
            var clientCount = new Set(filtered.map(function (e) { return e.client; })).size;
            var runningCount = filtered.filter(function (e) { return !e.endTime && !e.noTime; }).length;

            hero.innerHTML =
                '<div class="report-hero">' +
                '  <div class="hero-main">' +
                '    <p class="hero-label">' + t('totalHours') + '</p>' +
                '    <div class="hero-hours">' + total.toFixed(1) + '<span>h</span></div>' +
                '    <p class="hero-month">' + i18n[state.lang].months[state.currentMonth] + ' ' + state.currentYear + '</p>' +
                '    <div class="hero-stats">' +
                '      <span class="stat-chip"><i data-lucide="list-checks"></i>' + filtered.length + ' ' + t('activities') + '</span>' +
                '      <span class="stat-chip"><i data-lucide="building-2"></i>' + clientCount + ' ' + t('clients') + '</span>' +
                       (runningCount > 0 ? '<span class="stat-chip"><i data-lucide="timer"></i>' + runningCount + ' ' + t('running') + '</span>' : '') +
                '    </div>' +
                '  </div>' +
                '  <button type="button" id="export-btn" class="btn btn-export"' + (filtered.length === 0 ? ' disabled' : '') + '>' +
                '    <i data-lucide="download"></i> ' + t('exportBtn') +
                '  </button>' +
                '  <div class="hero-glow-rep"></div>' +
                '</div>';

            if (filtered.length === 0) {
                tableCard.innerHTML =
                    '<div class="report-empty"><div class="empty-state">' +
                    '  <i data-lucide="file-spreadsheet"></i>' +
                    '  <p class="empty-title">' + t('emptyReport') + '</p>' +
                    '  <p class="empty-sub">' + t('emptyReportSub') + '</p>' +
                    '</div></div>';
                refreshIcons();
                return;
            }

            var rows = '';
            getGroupedEntries(filtered).forEach(function (group) {
                var clientName = group[0];
                var clientTasks = group[1];
                var clientTotal = clientTasks.reduce(function (sum, t) { return sum + parseFloat(t.hours || 0); }, 0);

                rows +=
                    '<tr class="client-row">' +
                    '  <td colspan="5">' + esc(clientName) + '</td>' +
                    '  <td class="num client-total">&Sigma; ' + clientTotal.toFixed(1) + 'h</td>' +
                    '</tr>';

                clientTasks.forEach(function (e) {
                    var hours = parseFloat(e.hours || 0);
                    var d = new Date(e.date);
                    var dateLabel = isNaN(d) ? '-' : d.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', { day: '2-digit', month: '2-digit' });
                    var timeCell;
                    if (e.noTime) {
                        timeCell =
                        '    <div class="cell-hours">&mdash;</div>' +
                        '    <div class="cell-times">' + t('badgeNoTime') + '</div>';
                    } else {
                        timeCell =
                        '    <div class="cell-hours' + (!e.endTime ? ' running' : '') + '">' + hours.toFixed(1) + 'h</div>' +
                        '    <div class="cell-times">' + (e.endTime ? esc(e.startTime) + ' – ' + esc(e.endTime) : (state.lang==='id'?'Mulai: ':'Start: ') + esc(e.startTime)) + '</div>';
                    }
                    rows +=
                        '<tr class="data-row">' +
                        '  <td class="cell-date">' + dateLabel + '</td>' +
                        '  <td class="cell-client">' + esc(e.client) + '</td>' +
                        '  <td class="cell-job">' + esc(e.jobTitle || '-') + '</td>' +
                        '  <td class="cell-task">' + esc(e.task) + '</td>' +
                        '  <td class="cell-assoc">' + esc(e.associates) + '</td>' +
                        '  <td class="num">' + timeCell + '</td>' +
                        '</tr>';
