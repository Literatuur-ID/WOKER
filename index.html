<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOKER - Work Tracker for Lawyer</title>
    
    <!-- Script Loaders -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --midnight-1: #2c2a7b;
            --midnight-2: #232162;
            --midnight-3: #1b194f;
            --midnight-4: #161440;
            --midnight-5: #0f0e32;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fcfcfd; 
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .legal-card { 
            box-shadow: 0 4px 20px -5px rgb(0 0 0 / 0.1); 
            border: 1px solid #f1f5f9;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: var(--midnight-1); border-radius: 10px; }
        
        /* Mobile adjustments */
        input, textarea, select { font-size: 16px !important; }
        .transition-standard { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        try {
            let firebaseConfig;
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            } else {
                firebaseConfig = {
                    apiKey: "AIzaSyDJITYDWynAWET-W6UQmYyykt7qwK3MNXM",
                    authDomain: "woker-2b754.firebaseapp.com",
                    projectId: "woker-2b754",
                    storageBucket: "woker-2b754.firebasestorage.app",
                    messagingSenderId: "481506351045",
                    appId: "1:481506351045:web:074a37083a5585e1989dac",
                    measurementId: "G-LJPHP9KNTX"
                };
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'woker-custom-app';

            window.FirebaseServices = { 
                db, auth, appId, collection, doc, addDoc, deleteDoc, updateDoc, onSnapshot, 
                query, signInAnonymously, signInWithCustomToken, onAuthStateChanged 
            };
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (e) {
            console.error("Firebase init error:", e);
            window.FirebaseSetupError = e.message;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const IconTrash = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        );

        // Fungsi bantuan untuk mendapatkan jam saat ini dalam format HH:MM
        const getCurrentTime = () => {
            const now = new Date();
            return now.toTimeString().slice(0, 5);
        };

        function App() {
            const [user, setUser] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(!!localStorage.getItem('woker_access_key'));
            const [accessKey, setAccessKey] = useState(localStorage.getItem('woker_access_key') || '');
            const [userName, setUserName] = useState(localStorage.getItem('woker_user_name') || '');
            const [loginInput, setLoginInput] = useState('');
            const [entries, setEntries] = useState([]);
            
            const [formData, setFormData] = useState({ 
                client: '', jobTitle: '', task: '', date: new Date().toISOString().split('T')[0], 
                startTime: getCurrentTime(), endTime: '', associates: '' 
            });
            
            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
            const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
            const [activeTab, setActiveTab] = useState('input');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [modalMessage, setModalMessage] = useState(null);
            const [isCloudSyncing, setIsCloudSyncing] = useState(false);
            const [cloudError, setCloudError] = useState(false);

            // States untuk Custom Modals
            const [finishTaskModal, setFinishTaskModal] = useState(null);
            // State baru untuk menampung data yang bisa diedit di modal penyelesaian
            const [finishData, setFinishData] = useState({ date: '', startTime: '', endTime: '' });
            const [confirmAction, setConfirmAction] = useState(null);

            const isValidFormat = useMemo(() => {
                const regex = /^[A-Z]{3}-[0-9]{4}$/i;
                return regex.test(loginInput);
            }, [loginInput]);

            const handleLoginInputChange = (e) => {
                let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); 
                let formatted = val;
                if (val.length > 3) {
                    formatted = val.slice(0, 3) + '-' + val.slice(3, 7);
                }
                setLoginInput(formatted);
            };

            // Setup Firebase Authentication Listeners
            useEffect(() => {
                let isMounted = true;
                const setupAuth = async () => {
                    if (!window.FirebaseServices) return;
                    
                    try {
                        const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseServices;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        
                        onAuthStateChanged(auth, (u) => {
                            if (isMounted) {
                                setUser(u);
                                setFirebaseReady(true);
                            }
                        });
                    } catch (error) {
                        console.error("Auth Error:", error);
                        if (isMounted) {
                            setCloudError(true);
                            setModalMessage("Gagal masuk ke layanan Cloud. Pastikan Anonymous Auth aktif.");
                        }
                    }
                };

                if (window.FirebaseServices) {
                    setupAuth();
                } else {
                    const listener = () => setupAuth();
                    window.addEventListener('firebase-ready', listener);
                    const interval = setInterval(() => {
                        if (window.FirebaseServices) {
                            clearInterval(interval);
                            window.removeEventListener('firebase-ready', listener);
                            setupAuth();
                        } else if (window.FirebaseSetupError) {
                            clearInterval(interval);
                            setCloudError(true);
                            setModalMessage(window.FirebaseSetupError);
                        }
                    }, 200);
                    return () => {
                        isMounted = false;
                        window.removeEventListener('firebase-ready', listener);
                        clearInterval(interval);
                    };
                }
                return () => { isMounted = false; };
            }, []);

            // Ambil Data Firestore
            useEffect(() => {
                if (!firebaseReady || !user || !isLoggedIn || !accessKey || !userName || !window.FirebaseServices) return;
                
                const { db, appId, collection, onSnapshot } = window.FirebaseServices;
                setIsCloudSyncing(true);
                const safeKey = `data_${accessKey.trim().toLowerCase().replace(/[^a-z0-9]/g, '_')}`;
                
                const q = collection(db, 'artifacts', appId, 'public', 'data', safeKey);
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setEntries(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setIsCloudSyncing(false);
                    setCloudError(false); 
                }, (error) => { 
                    console.error("Firestore Error:", error); 
                    setCloudError(true);
                    setModalMessage("Gagal membaca data. Pastikan Firestore Database di Firebase Anda sudah diubah menjadi 'Test Mode' (Allow read, write) pada tab Rules.");
                    setIsCloudSyncing(false); 
                });
                
                return () => unsubscribe();
            }, [user, isLoggedIn, accessKey, userName, firebaseReady]);

            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            const filteredEntries = useMemo(() => {
                return entries.filter(e => {
                    const d = new Date(e.date);
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [entries, currentMonth, currentYear]);

            const groupedEntries = useMemo(() => {
                const groups = {};
                filteredEntries.forEach(entry => {
                    if (!groups[entry.client]) groups[entry.client] = [];
                    groups[entry.client].push(entry);
                });
                return Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]));
            }, [filteredEntries]);

            const totalHours = filteredEntries.reduce((sum, e) => sum + parseFloat(e.hours || 0), 0);

            const handleLogin = (e) => {
                e.preventDefault();
                if (!isValidFormat) return;
                const key = loginInput.trim().toUpperCase();
                setAccessKey(key);
                setIsLoggedIn(true);
                if (e.target.remember.checked) localStorage.setItem('woker_access_key', key);
            };

            const handleSetName = (e) => {
                e.preventDefault();
                const name = e.target.username.value.trim();
                if (name.length < 2) return setModalMessage("Nama minimal 2 karakter.");
                setUserName(name);
                localStorage.setItem('woker_user_name', name);
            };

            const handleLogout = () => {
                setConfirmAction({
                    message: "Apakah Anda yakin ingin keluar dari akun ini?",
                    onConfirm: () => {
                        localStorage.removeItem('woker_access_key');
                        localStorage.removeItem('woker_user_name');
                        setIsLoggedIn(false); setAccessKey(''); setUserName(''); setEntries([]);
                        setConfirmAction(null);
                    }
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user || !firebaseReady) {
                    setModalMessage("Gagal menyimpan. Aplikasi belum terhubung ke database Cloud.");
                    return;
                }
                
                setIsSubmitting(true);
                const { db, appId, collection, addDoc } = window.FirebaseServices;
                const safeKey = `data_${accessKey.trim().toLowerCase().replace(/[^a-z0-9]/g, '_')}`;
                
                let calculatedHours = 0;
                // Jika waktu selesai diisi, hitung jamnya. Jika kosong, biarkan 0 (berjalan).
                if (formData.startTime && formData.endTime) {
                    const start = new Date(`1970-01-01T${formData.startTime}:00`);
                    const end = new Date(`1970-01-01T${formData.endTime}:00`);
                    let diffMs = end - start;
                    if (diffMs < 0) diffMs += 24 * 60 * 60 * 1000;
                    calculatedHours = diffMs / (1000 * 60 * 60);
                }

                const newEntry = {
                    client: formData.client.toUpperCase(),
                    jobTitle: formData.jobTitle,
                    task: formData.task,
                    date: formData.date,
                    startTime: formData.startTime,
                    endTime: formData.endTime || '', 
                    hours: parseFloat(calculatedHours.toFixed(2)),
                    associates: formData.associates || '-',
                    author: userName, 
                    userId: user.uid, 
                    createdAt: new Date().toISOString()
                };
                
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', safeKey), newEntry);
                    // Reset form dan set Waktu Mulai ke jam saat ini lagi
                    setFormData({ ...formData, client: '', jobTitle: '', task: '', startTime: getCurrentTime(), endTime: '', associates: '' });
                } catch (err) { 
                    console.error("Submit Error:", err);
                    setModalMessage("Gagal menyimpan aktivitas. Silakan periksa koneksi internet atau 'Rules' Firestore Firebase Anda."); 
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Fungsi untuk memunculkan modal selesaikan pekerjaan
            const openFinishModal = (entry) => {
                setFinishData({
                    date: entry.date,
                    startTime: entry.startTime,
                    endTime: getCurrentTime() // Otomatis terisi jam saat ini
                });
                setFinishTaskModal(entry);
            };

            // Fungsi untuk mengeksekusi penyelesaian pekerjaan dari modal
            const submitFinishTask = async () => {
                if (!finishTaskModal || !finishData.startTime || !finishData.endTime || !finishData.date) {
                    setModalMessage("Mohon lengkapi Tanggal, Waktu Mulai, dan Waktu Selesai.");
                    return;
                }
                
                const { db, appId, doc, updateDoc } = window.FirebaseServices;
                const safeKey = `data_${accessKey.trim().toLowerCase().replace(/[^a-z0-9]/g, '_')}`;
                
                let calculatedHours = 0;
                const start = new Date(`${finishData.date}T${finishData.startTime}:00`);
                // Asumsi jika jam selesai lebih kecil, berarti melewati tengah malam di hari berikutnya
                let endDate = finishData.date;
                if (finishData.endTime < finishData.startTime) {
                    const nextDay = new Date(start);
                    nextDay.setDate(nextDay.getDate() + 1);
                    endDate = nextDay.toISOString().split('T')[0];
                }
                const end = new Date(`${endDate}T${finishData.endTime}:00`);
                
                let diffMs = end - start;
                if (diffMs > 0) {
                    calculatedHours = diffMs / (1000 * 60 * 60);
                }

                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', safeKey, finishTaskModal.id);
                    await updateDoc(docRef, {
                        date: finishData.date,
                        startTime: finishData.startTime,
                        endTime: finishData.endTime,
                        hours: parseFloat(calculatedHours.toFixed(2))
                    });
                    setFinishTaskModal(null);
                } catch (e) {
                    console.error(e);
                    setModalMessage("Gagal memperbarui status pekerjaan. Periksa perizinan Firebase Anda.");
                }
            };

            const handleDelete = (id) => {
                setConfirmAction({
                    message: "Hapus catatan pekerjaan ini secara permanen?",
                    onConfirm: async () => {
                        const { db, appId, doc, deleteDoc } = window.FirebaseServices;
                        const safeKey = `data_${accessKey.trim().toLowerCase().replace(/[^a-z0-9]/g, '_')}`;
                        try { 
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', safeKey, id)); 
                        } catch (e) { 
                            setModalMessage("Gagal menghapus data. Periksa perizinan Firebase Anda."); 
                        }
                        setConfirmAction(null);
                    }
                });
            };

            const exportExcel = () => {
                if (filteredEntries.length === 0) return;
                const data = filteredEntries.map(e => ({ 
                    "Tanggal": e.date, 
                    "Klien": e.client, 
                    "Pekerjaan": e.jobTitle || '-', 
                    "Detail Pekerjaan": e.task, 
                    "Associates": e.associates, 
                    "Waktu Mulai": e.startTime || '-', 
                    "Waktu Selesai": e.endTime || 'Masih Berjalan', 
                    "Durasi (Jam)": e.hours 
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Timesheet");
                XLSX.writeFile(wb, `WOKER_REPORT_${accessKey}_${months[currentMonth].toUpperCase()}.xlsx`);
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-white flex flex-col w-full items-center justify-center p-4">
                        <div className="w-full max-w-md">
                            <div className="bg-[#0f0e32] p-8 md:p-12 flex items-center justify-center rounded-b-[3rem] md:rounded-b-[4rem] shadow-2xl text-white">
                               <span className="text-4xl md:text-6xl font-black italic tracking-tighter uppercase">Woker</span>
                            </div>
                            <div className="px-6 pt-10 pb-16 w-full text-center md:text-left">
                                <h2 className="text-3xl md:text-4xl font-black text-slate-900 mb-2 tracking-tight uppercase">Hi, Wokers!</h2>
                                <p className="text-slate-500 font-medium text-sm mb-10">Masukkan Kode Rahasia anda.</p>
                                <form onSubmit={handleLogin} className="space-y-8">
                                    <input 
                                        name="specialCode" type="text" required maxLength="8" value={loginInput} onChange={handleLoginInputChange} placeholder="XXX-0000" 
                                        className={`w-full p-5 bg-slate-50 border-2 rounded-2xl md:rounded-[2rem] outline-none transition-all font-black text-center tracking-[0.2em] uppercase text-xl md:text-2xl shadow-inner ${loginInput && !isValidFormat ? 'border-red-400' : 'border-slate-100 focus:border-[#2c2a7b]'}`}
                                    />
                                    <label className="flex items-center justify-center gap-4 cursor-pointer no-tap-highlight">
                                        <input type="checkbox" name="remember" className="w-5 h-5 md:w-6 md:h-6 rounded accent-[#0f0e32]" defaultChecked />
                                        <span className="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-widest">Ingat Saya</span>
                                    </label>
                                    <div>
                                        <button disabled={!isValidFormat} className={`w-full font-black py-5 md:py-6 rounded-2xl md:rounded-[2rem] shadow-xl transition-standard uppercase text-xs tracking-[0.2em] ${isValidFormat ? 'bg-[#0f0e32] text-white active:scale-95' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}`}>Masuk</button>
                                        <p className="text-[9px] md:text-[10px] text-slate-400 font-bold uppercase tracking-widest leading-loose text-center mt-8 opacity-70 italic">
                                            ANDA DAPAT MENGAKSES AKUN PADA PERANGKAT LAIN DENGAN MEMASUKKAN KODE RAHASIA.
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            if (userName === '') {
                return (
                    <div className="min-h-screen bg-white flex flex-col w-full items-center justify-center p-6">
                        <div className="w-full max-w-md text-center">
                            <h2 className="text-3xl md:text-4xl font-black text-slate-900 mb-3 tracking-tight uppercase">Siapa Anda?</h2>
                            <p className="text-slate-500 font-medium text-sm mb-8 italic text-center">Masukkan nama lengkap atau inisial Anda.</p>
                            <form onSubmit={handleSetName} className="space-y-6">
                                <input name="username" type="text" required placeholder="e.g. Bli Juan" className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl md:rounded-[2rem] outline-none focus:border-[#2c2a7b] font-bold text-center text-lg md:text-xl shadow-inner uppercase" />
                                <button type="submit" className="w-full bg-[#0f0e32] text-white font-black py-5 md:py-6 rounded-2xl md:rounded-[2rem] shadow-xl uppercase text-xs tracking-[0.2em] active:scale-95 transition-all">SIMPAN</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20 flex flex-col items-center w-full bg-[#fcfcfd]">
                    <header className="bg-[#0f0e32] text-white sticky top-0 z-50 w-full shadow-2xl border-b border-[#232162]">
                        <div className="max-w-6xl mx-auto p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-xl md:text-3xl font-black italic tracking-tighter uppercase leading-none">Woker</h1>
                                <p className="text-[9px] md:text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold mt-1">Work Tracker for Lawyer</p>
                            </div>
                            <div className="flex items-center gap-3 bg-[#161440] px-4 md:px-6 py-2 rounded-full border border-[#232162] shadow-inner text-xs md:text-sm">
                                <button onClick={() => currentMonth === 0 ? (setCurrentMonth(11), setCurrentYear(currentYear-1)) : setCurrentMonth(currentMonth-1)} className="p-1 hover:text-blue-300">❮</button>
                                <div className="text-center min-w-[120px] md:min-w-[150px]">
                                    <div className="font-black uppercase tracking-widest">{months[currentMonth]}</div>
                                    <div className="text-[10px] font-mono text-slate-500">{currentYear}</div>
                                </div>
                                <button onClick={() => currentMonth === 11 ? (setCurrentMonth(0), setCurrentYear(currentYear+1)) : setCurrentMonth(currentMonth+1)} className="p-1 hover:text-blue-300">❯</button>
                            </div>
                        </div>
                    </header>

                    <main className="w-full max-w-6xl mt-4 md:mt-8 px-4 md:px-8">
                        {/* Status Bar */}
                        <div className="mb-6 flex flex-wrap justify-between items-center px-4 md:px-6 py-3 bg-white border border-slate-100 rounded-2xl shadow-sm text-[10px] md:text-[11px] font-black uppercase tracking-widest overflow-hidden">
                            <div className="flex items-center gap-2 md:gap-4 truncate">
                                <div className={`w-2 h-2 rounded-full shrink-0 ${cloudError ? 'bg-red-500' : (!user || isCloudSyncing) ? 'bg-blue-400 animate-pulse' : 'bg-green-500'}`}></div>
                                <span className="text-[#0f0e32] truncate">{userName}</span>
                                <span className="opacity-20 hidden sm:block">|</span>
                                <span className="hidden sm:block">ID: {accessKey}</span>
                            </div>
                            <button onClick={handleLogout} className="text-red-500 hover:underline uppercase text-[9px] md:text-[10px] shrink-0 ml-2">Log Out</button>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex bg-white rounded-2xl md:rounded-[2rem] p-1 border border-slate-100 mb-6 md:mb-10 shadow-sm font-bold">
                            <button onClick={() => setActiveTab('input')} className={`flex-1 py-3 md:py-4 rounded-xl md:rounded-[1.5rem] text-[10px] md:text-xs tracking-widest transition-standard ${activeTab === 'input' ? 'bg-[#0f0e32] text-white shadow-lg' : 'text-slate-400'}`}>PEKERJAAN</button>
                            <button onClick={() => setActiveTab('rekap')} className={`flex-1 py-3 md:py-4 rounded-xl md:rounded-[1.5rem] text-[10px] md:text-xs tracking-widest transition-standard ${activeTab === 'rekap' ? 'bg-[#0f0e32] text-white shadow-lg' : 'text-slate-400'}`}>LAPORAN</button>
                        </div>

                        {activeTab === 'input' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
                                {/* Form */}
                                <div className="lg:col-span-5">
                                    <form onSubmit={handleSubmit} className="bg-white p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] legal-card space-y-6 lg:sticky lg:top-32 border-t-4 md:border-t-8 border-t-[#2c2a7b]">
                                        <h3 className="font-black text-[#0f0e32] text-sm md:text-base italic border-b pb-4 uppercase tracking-tighter">Giat apa hari ini?</h3>
                                        <div className="space-y-4">
                                            <div className="space-y-1">
                                                <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Klien</label>
                                                <input required type="text" value={formData.client} onChange={e => setFormData({...formData, client: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#2c2a7b] font-bold text-sm" placeholder="e.g. BANK INDONESIA" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Waktu (Mulai - Selesai)</label>
                                                    <div className="flex gap-2 items-center">
                                                        <input required type="time" value={formData.startTime} onChange={e => setFormData({...formData, startTime: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold" />
                                                        <span className="font-black text-slate-300">-</span>
                                                        <input type="time" value={formData.endTime} onChange={e => setFormData({...formData, endTime: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold" />
                                                    </div>
                                                    <p className="text-[8px] font-bold text-orange-500 italic ml-1 mt-1">*Selesai opsional (Bisa diisi nanti)</p>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Tanggal</label>
                                                    <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold" />
                                                </div>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Associates</label>
                                                <input type="text" value={formData.associates} onChange={e => setFormData({...formData, associates: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold" placeholder="e.g. Tana, Tini, & Tunu" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Pekerjaan</label>
                                                <input required type="text" value={formData.jobTitle || ''} onChange={e => setFormData({...formData, jobTitle: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#2c2a7b] font-bold text-sm" placeholder="e.g. Legal Memorandum" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Detail Pekerjaan</label>
                                                <textarea required value={formData.task} onChange={e => setFormData({...formData, task: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none min-h-[120px] text-sm font-medium leading-relaxed" placeholder="Uraikan giat Anda..."></textarea>
                                            </div>
                                        </div>
                                        <button 
                                            disabled={isSubmitting} 
                                            type="submit"
                                            className={`w-full font-black py-5 rounded-xl shadow-lg transition-standard transform active:scale-[0.98] uppercase tracking-[0.2em] text-[11px] flex items-center justify-center gap-3 ${isSubmitting ? 'bg-slate-300 text-slate-500 cursor-wait' : 'bg-[#0f0e32] text-white hover:bg-[#161440]'}`}
                                        >
                                            {isSubmitting && <span className="animate-spin-custom w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>}
                                            {isSubmitting ? 'MENYIMPAN...' : 'SIMPAN'}
                                        </button>
                                        {!firebaseReady && !cloudError && (
                                            <p className="text-[9px] text-orange-600 font-bold text-center mt-2 animate-pulse uppercase">Memuat Konfigurasi Cloud...</p>
                                        )}
                                        {firebaseReady && !user && !cloudError && (
                                            <p className="text-[9px] text-orange-600 font-bold text-center mt-2 animate-pulse uppercase">Menghubungkan ke Akun Anonim...</p>
                                        )}
                                        {cloudError && (
                                            <p className="text-[9px] text-red-600 font-bold text-center mt-2 uppercase">Koneksi Cloud Ditolak Server</p>
                                        )}
                                    </form>
                                </div>

                                {/* List */}
                                <div className="lg:col-span-7 space-y-4 md:space-y-6">
                                    <div className="flex justify-between items-center px-4">
                                        <h3 className="font-black text-[#0f0e32] text-[10px] md:text-xs uppercase tracking-[0.3em]">RIWAYAT PEKERJAAN</h3>
                                        <span className="text-[9px] md:text-[10px] font-black text-slate-400 bg-slate-100 px-3 py-1 rounded-full">{filteredEntries.length} Items</span>
                                    </div>
                                    {filteredEntries.map(entry => (
                                        <div key={entry.id} className={`bg-white p-5 md:p-8 rounded-2xl md:rounded-[3rem] border shadow-sm flex items-start gap-4 md:gap-6 group relative transition-all ${!entry.endTime ? 'border-orange-300' : 'border-slate-100 hover:border-[#2c2a7b]/30'}`}>
                                            <div className={`${!entry.endTime ? 'bg-orange-500 border-orange-600 animate-pulse' : 'bg-[#0f0e32] border-[#232162]'} text-white w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-2xl flex flex-col items-center justify-center shrink-0 shadow-lg border`}>
                                                <span className="text-lg md:text-xl font-black leading-none">{new Date(entry.date).getDate()}</span>
                                                <span className="text-[7px] md:text-[8px] uppercase font-black opacity-40">{new Date(entry.date).toLocaleDateString('id-ID', {weekday:'short'})}</span>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap items-center gap-2 mb-2">
                                                    <span className="text-sm md:text-base font-black text-[#2c2a7b] uppercase truncate max-w-[150px] md:max-w-none">{entry.client}</span>
                                                    
                                                    {/* Badge Status Waktu */}
                                                    {entry.endTime ? (
                                                        <span className="text-[9px] font-black text-slate-400 bg-slate-50 px-2 py-0.5 rounded-lg border border-slate-100">
                                                            {entry.startTime} - {entry.endTime} ({entry.hours}h)
                                                        </span>
                                                    ) : (
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className="text-[9px] font-black text-orange-600 bg-orange-50 px-2 py-0.5 rounded-lg border border-orange-200">
                                                                Mulai: {entry.startTime} (BERJALAN)
                                                            </span>
                                                            <button type="button" onClick={() => openFinishModal(entry)} className="bg-[#2c2a7b] text-white text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-wider hover:bg-orange-500 transition-colors shadow-md transform active:scale-95">
                                                                Selesaikan Sekarang
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                                {entry.jobTitle && <p className="text-[11px] font-black text-[#0f0e32] uppercase mb-1">{entry.jobTitle}</p>}
                                                <p className="text-[13px] md:text-[14px] text-slate-700 font-medium mb-2 leading-relaxed line-clamp-3 md:line-clamp-none">{entry.task}</p>
                                                <p className="text-[9px] md:text-[10px] font-black italic text-[#2c2a7b] opacity-60">Associates: {entry.associates}</p>
                                            </div>
                                            <button onClick={() => handleDelete(entry.id)} className="text-slate-300 hover:text-red-500 p-2 md:p-3 transition-standard lg:opacity-0 group-hover:opacity-100 self-center"><IconTrash /></button>
                                        </div>
                                    ))}
                                    {filteredEntries.length === 0 && (
                                        <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-[2rem] md:rounded-[4rem] py-20 md:py-32 text-center text-slate-300 font-black uppercase text-[10px] md:text-[11px] tracking-[0.4em]">Belum Ada Data</div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* Report Tab */
                            <div className="space-y-8 md:space-y-12">
                                <div className="bg-gradient-to-br from-[#0f0e32] to-[#232162] text-white p-8 md:p-16 rounded-[2.5rem] md:rounded-[4rem] shadow-2xl flex flex-col lg:flex-row justify-between items-center gap-8 relative overflow-hidden">
                                    <div className="relative z-10 text-center lg:text-left">
                                        <p className="text-blue-200 text-[10px] font-black uppercase tracking-[0.5em] mb-4 opacity-80">TOTAL JAM KERJA</p>
                                        <div className="text-6xl md:text-8xl lg:text-9xl font-black tracking-tighter leading-none">{totalHours.toFixed(1)} <span className="text-2xl md:text-3xl font-light text-slate-400 italic">h</span></div>
                                        <p className="text-slate-400 mt-4 md:mt-8 font-bold text-xs md:text-sm uppercase tracking-[0.4em]">{months[currentMonth]} {currentYear}</p>
                                    </div>
                                    <div className="flex flex-col sm:flex-row lg:flex-col gap-4 w-full sm:w-auto relative z-10">
                                        <button onClick={exportExcel} className="bg-[#2c2a7b] text-white border border-white/10 px-8 md:px-12 py-4 md:py-5 rounded-2xl md:rounded-[2rem] font-black text-[10px] md:text-xs shadow-xl transition-standard uppercase tracking-[0.2em] w-full hover:bg-white hover:text-[#2c2a7b]">Unduh Excel</button>
                                    </div>
                                    <div className="absolute -bottom-20 -right-20 w-64 h-64 bg-blue-600 rounded-full blur-[100px] opacity-10"></div>
                                </div>

                                <div className="bg-white rounded-2xl md:rounded-[3rem] shadow-xl border border-slate-50 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <div className="min-w-[800px]">
                                            <table className="w-full text-left">
                                                <thead>
                                                    <tr className="bg-slate-50/50">
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em]">Tgl</th>
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em]">Klien</th>
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em]">Pekerjaan</th>
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em]">Detail Pekerjaan</th>
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em]">Associates</th>
                                                        <th className="px-6 py-8 font-black uppercase text-slate-400 text-[9px] md:text-[10px] tracking-[0.3em] text-right">Waktu & Jam</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {groupedEntries.map(([clientName, clientTasks]) => {
                                                        const clientTotal = clientTasks.reduce((sum, t) => sum + t.hours, 0);
                                                        return (
                                                            <React.Fragment key={clientName}>
                                                                <tr className="bg-slate-50/30 border-l-[8px] md:border-l-[10px] border-[#2c2a7b]">
                                                                    <td colSpan="5" className="px-6 py-6 font-black text-[#0f0e32] uppercase text-sm md:text-base">{clientName}</td>
                                                                    <td className="px-6 py-6 text-right font-black text-[#2c2a7b] text-base md:text-lg italic tracking-tight">Σ {clientTotal.toFixed(1)}h</td>
                                                                </tr>
                                                                {clientTasks.map(e => (
                                                                    <tr key={e.id} className="hover:bg-slate-50/50 transition-colors">
                                                                        <td className="px-6 py-6 text-slate-400 font-bold text-[11px] whitespace-nowrap">{new Date(e.date).toLocaleDateString('id-ID', {day: '2-digit', month: '2-digit'})}</td>
                                                                        <td className="px-6 py-6 text-[#0f0e32] font-black text-[10px] uppercase tracking-tighter truncate max-w-[120px]">{e.client}</td>
                                                                        <td className="px-6 py-6 text-[#0f0e32] font-bold text-[11px] uppercase whitespace-nowrap">{e.jobTitle || '-'}</td>
                                                                        <td className="px-6 py-6 max-w-sm">
                                                                            <div className="text-[12px] md:text-[13px] text-slate-600 font-bold leading-relaxed italic">{e.task}</div>
                                                                        </td>
                                                                        <td className="px-6 py-6 text-slate-400 text-[10px] font-black uppercase truncate max-w-[120px]">{e.associates}</td>
                                                                        <td className="px-6 py-6 text-right whitespace-nowrap">
                                                                            <div className={`font-black ${!e.endTime ? 'text-orange-500 animate-pulse' : 'text-slate-900'} text-lg md:text-xl tracking-tighter`}>{e.hours.toFixed(1)}h</div>
                                                                            <div className="text-[10px] font-bold text-slate-400 mt-1">
                                                                                {e.endTime ? `${e.startTime} - ${e.endTime}` : `Mulai: ${e.startTime}`}
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div className="bg-[#0f0e32] p-6 text-center text-white/20 text-[8px] font-black uppercase tracking-[0.5em]">
                                        End of Report Record
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Universal Modal */}
                    {modalMessage && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[1000] flex items-center justify-center p-6 text-center">
                            <div className="bg-white rounded-[2.5rem] md:rounded-[4rem] p-10 md:p-16 max-w-sm w-full shadow-2xl border border-slate-100 animate-in zoom-in duration-300">
                                <h4 className="font-black mb-3 text-[#0f0e32] text-xl md:text-2xl uppercase italic">Info</h4>
                                <p className="text-slate-600 text-xs md:text-sm mb-10 leading-relaxed font-bold">{modalMessage}</p>
                                <button onClick={() => setModalMessage(null)} className="w-full bg-[#0f0e32] text-white font-black text-[10px] py-5 rounded-2xl md:rounded-[2rem] uppercase tracking-widest active:scale-95 transition-all shadow-lg">Tutup</button>
                            </div>
                        </div>
                    )}

                    {/* Finish Task Modal (Opsi Lengkap) */}
                    {finishTaskModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[1000] flex items-center justify-center p-6 text-center">
                            <div className="bg-white rounded-[2.5rem] md:rounded-[3rem] p-8 md:p-10 max-w-sm w-full shadow-2xl border border-slate-100 animate-in zoom-in duration-300">
                                <h4 className="font-black mb-2 text-[#0f0e32] text-xl md:text-2xl uppercase italic">Selesaikan</h4>
                                <p className="text-slate-500 text-xs md:text-sm mb-6 font-bold truncate">{finishTaskModal.jobTitle || finishTaskModal.client}</p>
                                
                                <div className="space-y-4 mb-8 text-left">
                                    <div className="space-y-1">
                                        <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 block">Tanggal</label>
                                        <input 
                                            type="date" 
                                            value={finishData.date} 
                                            onChange={(e) => setFinishData({...finishData, date: e.target.value})}
                                            className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold focus:border-[#2c2a7b]" 
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 block text-center">Waktu Mulai</label>
                                            <input 
                                                type="time" 
                                                value={finishData.startTime} 
                                                onChange={(e) => setFinishData({...finishData, startTime: e.target.value})}
                                                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-lg md:text-xl font-black text-center focus:border-[#2c2a7b]" 
                                            />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 block text-center">Waktu Selesai</label>
                                            <input 
                                                type="time" 
                                                value={finishData.endTime} 
                                                onChange={(e) => setFinishData({...finishData, endTime: e.target.value})}
                                                className="w-full p-3 bg-[#f0f4ff] border border-blue-200 text-[#2c2a7b] rounded-xl outline-none text-lg md:text-xl font-black text-center focus:border-[#2c2a7b]" 
                                            />
                                        </div>
                                    </div>
                                    <p className="text-[9px] md:text-[10px] mt-2 text-slate-400 font-bold text-center leading-relaxed">
                                        Sesuaikan data di atas jika terdapat ketidakakuratan sebelum disimpan secara permanen.
                                    </p>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setFinishTaskModal(null)} className="flex-1 bg-slate-100 text-slate-500 font-black text-[10px] py-4 md:py-5 rounded-2xl uppercase tracking-widest active:scale-95 transition-all">Batal</button>
                                    <button onClick={submitFinishTask} className="flex-1 bg-[#0f0e32] text-white font-black text-[10px] py-4 md:py-5 rounded-2xl uppercase tracking-widest active:scale-95 transition-all shadow-lg">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Confirmation Modal (Hapus/Logout) */}
                    {confirmAction && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[1000] flex items-center justify-center p-6 text-center">
                            <div className="bg-white rounded-[2.5rem] md:rounded-[4rem] p-10 md:p-12 max-w-sm w-full shadow-2xl border border-slate-100 animate-in zoom-in duration-300">
                                <h4 className="font-black mb-3 text-[#0f0e32] text-xl md:text-2xl uppercase italic">Konfirmasi</h4>
                                <p className="text-slate-600 text-xs md:text-sm mb-10 leading-relaxed font-bold">{confirmAction.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmAction(null)} className="flex-1 bg-slate-100 text-slate-500 font-black text-[10px] py-4 md:py-5 rounded-2xl uppercase tracking-widest active:scale-95 transition-all">Batal</button>
                                    <button onClick={confirmAction.onConfirm} className="flex-1 bg-red-500 text-white font-black text-[10px] py-4 md:py-5 rounded-2xl uppercase tracking-widest active:scale-95 transition-all shadow-lg">Ya, Lanjutkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
