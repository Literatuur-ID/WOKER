            });

            tableCard.innerHTML =
                '<div class="table-scroll">' +
                '  <table class="report-table">' +
                '    <thead><tr>' +
                '      <th>' + t('thDate') + '</th><th>' + t('thClient') + '</th><th>' + t('thJob') + '</th><th>' + t('thTask') + '</th><th>' + t('thAssoc') + '</th><th class="num">' + t('thTime') + '</th>' +
                '    </tr></thead>' +
                '    <tbody>' + rows + '</tbody>' +
                '  </table>' +
                '</div>' +
                '<div class="report-footer">' + t('endReport') + '</div>';
            refreshIcons();
        };

        /* ---------- Autocomplete suggestions (from entry history) ---------- */
        var updateDatalists = function() {
            var fill = function(sel, values) {
                var dl = $(sel);
                if (!dl) return;
                dl.innerHTML = values.map(function (v) {
                    return '<option value="' + esc(v) + '"></option>';
                }).join('');
            };
            var uniqueValues = function(getter) {
                var seen = {};
                var out = [];
                state.entries.forEach(function (e) {
                    var v = String(getter(e) || '').trim();
                    if (!v || v === '-') return;
                    var k = v.toLowerCase();
                    if (!seen[k]) { seen[k] = true; out.push(v); }
                });
                return out.sort(function (a, b) { return a.localeCompare(b); });
            };
            fill('#dl-client', uniqueValues(function (e) { return e.client; }));
            fill('#dl-assoc', uniqueValues(function (e) { return e.associates; }));
            fill('#dl-job', uniqueValues(function (e) { return e.jobTitle; }));
        };

        var updateMonthGlance = function() {
            var el = $('#month-glance');
            if (!el) return;
            var filtered = getFilteredEntries();
            var total = getTotalHours(filtered);
            var clientCount = new Set(filtered.map(function (e) { return e.client; })).size;
            var runningCount = filtered.filter(function (e) { return !e.endTime && !e.noTime; }).length;
            el.innerHTML =
                '<div class="glance-item"><span class="glance-num is-accent">' + total.toFixed(1) + '<small>h</small></span><span class="glance-label">' + t('totalHours') + '</span></div>' +
                '<div class="glance-item"><span class="glance-num">' + filtered.length + '</span><span class="glance-label">' + t('activities') + '</span></div>' +
                '<div class="glance-item"><span class="glance-num">' + clientCount + '</span><span class="glance-label">' + t('clients') + '</span></div>' +
                '<div class="glance-item"><span class="glance-num' + (runningCount > 0 ? ' is-warning' : '') + '">' + runningCount + '</span><span class="glance-label">' + t('running') + '</span></div>';
        };

        var refreshDynamic = function() {
            renderEntryList();
            renderReport();
            updateDatalists();
            updateMonthGlance();
        };

        /* =====================================================
           Actions
           ===================================================== */
        var setSubmitting = function(on) {
            state.isSubmitting = on;
            var btn = $('#submit-btn');
            if (!btn) return;
            btn.disabled = on;
            btn.innerHTML = on
                ? '<span class="spinner"></span> ' + t('btnSaving')
                : '<i data-lucide="save"></i> ' + t('btnSave');
            refreshIcons();
        };

        var handleSubmit = async function(e) {
            e.preventDefault();
            if (state.isSubmitting) return;
            if (!state.user || !state.firebaseReady) {
                showInfoModal(t('errConnect'));
                return;
            }

            var client = $('#f-client').value.trim();
            var date = $('#f-date').value;
            var trackTime = $('#f-track').checked;
            var startTime = trackTime ? $('#f-start').value : '';
            var endTime = trackTime ? $('#f-end').value : '';
            var associates = $('#f-assoc').value.trim();
            var jobTitle = $('#f-job').value.trim();
            var task = $('#f-task').value.trim();

            var newEntry = {
                client: client.toUpperCase(),
                jobTitle: jobTitle,
                task: task,
                date: date,
                startTime: startTime,
                endTime: endTime || '',
                hours: endTime ? calcHours(startTime, endTime) : 0,
                noTime: !trackTime,
                associates: associates || '-',
                author: state.userName,
                userId: state.user.uid,
                createdAt: new Date().toISOString()
            };

            setSubmitting(true);
            var fs = window.FirebaseServices;
            try {
                await fs.addDoc(fs.collection(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey)), newEntry);
                $('#f-client').value = '';
                $('#f-job').value = '';
                $('#f-task').value = '';
                $('#f-assoc').value = '';
                $('#f-end').value = '';
                $('#f-start').value = getCurrentTime();
                showToast(t('toastSaved'));
            } catch (err) {
                console.error('Submit Error:', err);
                showInfoModal(t('syncErr'));
            } finally {
                setSubmitting(false);
            }
        };

        var openFinishModal = function(entry) {
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="check-circle-2"></i></div>' +
                '<h4 class="modal-title">' + t('modalFinish') + '</h4>' +
                '<p class="modal-sub">' + esc(entry.jobTitle || entry.client) + '</p>' +
                '<div class="modal-fields">' +
                '  <div class="field">' +
                '    <label class="label">' + t('fDate') + '</label>' +
                '    <input id="fm-date" type="date" value="' + esc(entry.date) + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fStart') + '</label>' +
                '    <input id="fm-start" type="time" value="' + esc(entry.startTime) + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fEnd') + '</label>' +
                '    <input id="fm-end" type="time" class="input-optional" value="' + getCurrentTime() + '">' +
                '  </div>' +
                '  <p class="modal-hint">' + t('modalHint') + '</p>' +
                '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-save>' + t('btnSave') + '</button>' +
                '</div>'
            );

            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-save]').addEventListener('click', async function () {
                var date = overlay.querySelector('#fm-date').value;
                var startTime = overlay.querySelector('#fm-start').value;
                var endTime = overlay.querySelector('#fm-end').value;
                if (!date || !startTime || !endTime) {
                    showInfoModal(t('errIncomplete'));
                    return;
                }

                var calculatedHours = calcHours(startTime, endTime);
                // Adjust if cross midnight (simple heuristic)
                if (endTime < startTime) {
                    var start = new Date(date + 'T' + startTime + ':00');
                    var nextDay = new Date(start);
                    nextDay.setDate(nextDay.getDate() + 1);
                    var end = new Date(nextDay.toISOString().split('T')[0] + 'T' + endTime + ':00');
                    calculatedHours = (end - start) / 3600000;
                }

                var fs = window.FirebaseServices;
                try {
                    var docRef = fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), entry.id);
                    await fs.updateDoc(docRef, {
                        date: date,
                        startTime: startTime,
                        endTime: endTime,
                        hours: parseFloat(calculatedHours.toFixed(2))
                    });
                    closeModal(overlay);
                    showToast(t('toastFinished'));
                } catch (err) {
                    console.error(err);
                    showInfoModal(t('syncErr'));
                }
            });
        };

        var handleFinishAll = function() {
            var running = getRunningEntries();
            if (running.length === 0) return;
            var now = getCurrentTime();

            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="check-check"></i></div>' +
                '<h4 class="modal-title">' + t('btnFinishAll') + '</h4>' +
                '<p class="modal-sub">' + t('modalFinishAllTxt', { count: running.length }) + '</p>' +
                '<div class="modal-fields">' +
                '  <label class="track-toggle">' +
                '    <input type="checkbox" id="fa-track" checked>' +
                '    <span>' + t('fTrackTime') + '</span>' +
                '  </label>' +
                '  <div class="field" id="fa-end-field">' +
                '    <label class="label">' + t('fEnd') + '</label>' +
                '    <input id="fa-end" type="time" value="' + now + '">' +
                '  </div>' +
                '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-ok>' + t('modalConfirm') + '</button>' +
                '</div>',
                true
            );

            overlay.querySelector('#fa-track').addEventListener('change', function () {
                overlay.querySelector('#fa-end-field').hidden = !overlay.querySelector('#fa-track').checked;
            });
            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('[data-modal-ok]').addEventListener('click', async function () {
                var track = overlay.querySelector('#fa-track').checked;
                var endTime = overlay.querySelector('#fa-end').value;
                if (track && !endTime) {
                    showInfoModal(t('errIncomplete'));
                    return;
                }

                var okBtn = overlay.querySelector('[data-modal-ok]');
                okBtn.disabled = true;
                okBtn.innerHTML = '<span class="spinner"></span>';

                var fs = window.FirebaseServices;
                try {
                    await Promise.all(running.map(function (entry) {
                        var docRef = fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), entry.id);
                        return fs.updateDoc(docRef, track
                            ? { endTime: endTime, hours: calcHours(entry.startTime, endTime) }
                            : { noTime: true, startTime: '', endTime: '', hours: 0 });
                    }));
                    closeModal(overlay);
                    showToast(t('toastFinishedAll', { count: running.length }));
                } catch (err) {
                    console.error('Finish All Error:', err);
                    closeModal(overlay);
                    showInfoModal(t('syncErr'));
                }
            });
        };

        var openEditModal = function(entry) {
            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="pencil-line"></i></div>' +
                '<h4 class="modal-title">' + t('modalEdit') + '</h4>' +
                '<div class="modal-fields">' +
                '  <div class="field">' +
                '    <label class="label">' + t('fClient') + '</label>' +
                '    <input id="me-client" type="text" list="dl-client" value="' + esc(entry.client) + '">' +
                '  </div>' +
                '  <div class="field-row">' +
                '    <div class="field"><label class="label">' + t('fDate') + '</label><input id="me-date" type="date" value="' + esc(entry.date) + '"></div>' +
                '    <div class="field"><label class="label">' + t('fAssoc') + '</label><input id="me-assoc" type="text" list="dl-assoc" value="' + esc(entry.associates) + '"></div>' +
                '  </div>' +
                '  <label class="track-toggle">' +
                '    <input type="checkbox" id="me-track"' + (!entry.noTime ? ' checked' : '') + '>' +
                '    <span>' + t('fTrackTime') + '</span>' +
                '  </label>' +
                '  <div class="field-row" id="me-time-row"' + (entry.noTime ? ' hidden' : '') + '>' +
                '    <div class="field"><label class="label">' + t('fStart') + '</label><input id="me-start" type="time" value="' + esc(entry.startTime) + '"></div>' +
                '    <div class="field"><label class="label">' + t('fEnd') + '</label><input id="me-end" type="time" class="' + (!entry.endTime ? 'input-optional' : '') + '" value="' + esc(entry.endTime || '') + '"></div>' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fJob') + '</label>' +
                '    <input id="me-job" type="text" list="dl-job" value="' + esc(entry.jobTitle || '') + '">' +
                '  </div>' +
                '  <div class="field">' +
                '    <label class="label">' + t('fTask') + '</label>' +
                '    <textarea id="me-task">' + esc(entry.task) + '</textarea>' +
                '  </div>' +
                '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-save>' + t('btnSave') + '</button>' +
                '</div>'
            );

            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () { closeModal(overlay); });
            overlay.querySelector('#me-track').addEventListener('change', function () {
                overlay.querySelector('#me-time-row').hidden = !overlay.querySelector('#me-track').checked;
            });
            overlay.querySelector('[data-modal-save]').addEventListener('click', async function () {
                var client = overlay.querySelector('#me-client').value.trim();
                var date = overlay.querySelector('#me-date').value;
                var associates = overlay.querySelector('#me-assoc').value.trim();
                var track = overlay.querySelector('#me-track').checked;
                var startTime = track ? overlay.querySelector('#me-start').value : '';
                var endTime = track ? overlay.querySelector('#me-end').value : '';
                var jobTitle = overlay.querySelector('#me-job').value.trim();
                var task = overlay.querySelector('#me-task').value.trim();

                if (!client || !date || (track && !startTime) || !jobTitle || !task) {
                    showInfoModal(state.lang==='id'?'Mohon lengkapi field yang wajib.':'Please complete required fields.');
                    return;
                }

                var calculatedHours = 0;
                if (endTime) {
                    calculatedHours = calcHours(startTime, endTime);
                    if (endTime < startTime) {
                        var start = new Date(date + 'T' + startTime + ':00');
                        var nextDay = new Date(start);
                        nextDay.setDate(nextDay.getDate() + 1);
                        var end = new Date(nextDay.toISOString().split('T')[0] + 'T' + endTime + ':00');
                        calculatedHours = (end - start) / 3600000;
                    }
                }

                var fs = window.FirebaseServices;
                try {
                    var docRef = fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), entry.id);
                    await fs.updateDoc(docRef, {
                        client: client.toUpperCase(),
                        date: date,
                        associates: associates || '-',
                        startTime: startTime,
                        endTime: endTime || '',
                        jobTitle: jobTitle,
                        task: task,
                        noTime: !track,
                        hours: parseFloat(calculatedHours.toFixed(2))
                    });
                    closeModal(overlay);
                    showToast(t('toastUpdated'));
                } catch (err) {
                    console.error(err);
                    showInfoModal(t('syncErr'));
                }
            });
        };

        var handleDelete = function(id) {
            showConfirm(t('modalDeleteTxt'), t('modalDeleteBtn'), async function () {
                var fs = window.FirebaseServices;
                try {
                    await fs.deleteDoc(fs.doc(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey), id));
                    showToast(t('toastDeleted'), 'trash-2');
                } catch (err) {
                    showInfoModal(t('syncErr'));
                }
            });
        };

        var handleLogout = function() {
            showConfirm(t('modalLogoutTxt'), t('modalLogoutBtn'), function () {
                localStorage.removeItem('woker_access_key');
                localStorage.removeItem('woker_user_name');
                if (state.unsubscribe) { state.unsubscribe(); state.unsubscribe = null; }
                state.subscribedKey = null;
                state.isLoggedIn = false;
                state.accessKey = '';
                state.userName = '';
                state.entries = [];
                state.hasLoadedOnce = false;
                state.activeTab = 'input';
                render();
            });
        };

        /* ---------- Excel import ---------- */
        var pad2 = function(n) { return String(n).padStart(2, '0'); };

        var parseImportDate = function(v) {
            if (v == null || v === '') return '';
            if (v instanceof Date && !isNaN(v)) {
                return v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
            }
            if (typeof v === 'number') {
                var dc = XLSX.SSF.parse_date_code(v);
                return (dc && dc.y) ? dc.y + '-' + pad2(dc.m) + '-' + pad2(dc.d) : '';
            }
            var s = String(v).trim();
            var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
            m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
            if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
            var d = new Date(s);
            return isNaN(d) ? '' : d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        };

        var parseImportTime = function(v) {
            if (v == null || v === '') return '';
            if (v instanceof Date && !isNaN(v)) return pad2(v.getHours()) + ':' + pad2(v.getMinutes());
            if (typeof v === 'number') {
                var mins = Math.round((v % 1) * 24 * 60);
                return pad2(Math.floor(mins / 60) % 24) + ':' + pad2(mins % 60);
            }
            var m = String(v).trim().match(/^(\d{1,2})[:.](\d{2})/);
            return m ? pad2(m[1]) + ':' + m[2] : '';
        };

        // Column recognition: order matters — "detail" patterns must claim their
        // column before the broader job/task patterns get a chance.
        var IMPORT_COL_DEFS = [
            { key: 'task',   re: /detail|desc|uraian/i },
            { key: 'date',   re: /tanggal|tgl|date/i },
            { key: 'client', re: /klien|client/i },
            { key: 'assoc',  re: /assoc/i },
            { key: 'start',  re: /mulai|start/i },
            { key: 'end',    re: /selesai|end|finish/i },
            { key: 'hours',  re: /durasi|duration|hours|jam/i },
            { key: 'job',    re: /pekerjaan|job|task/i }
        ];

        var findImportHeader = function(rows) {
            for (var r = 0; r < Math.min(rows.length, 30); r++) {
                var row = rows[r] || [];
                var map = {};
                for (var c = 0; c < row.length; c++) {
                    var cell = String(row[c] == null ? '' : row[c]).trim();
                    if (!cell) continue;
                    for (var i = 0; i < IMPORT_COL_DEFS.length; i++) {
                        var def = IMPORT_COL_DEFS[i];
                        if (map[def.key] == null && def.re.test(cell)) { map[def.key] = c; break; }
                    }
                }
                if (map.date != null && map.client != null && (map.task != null || map.job != null)) {
                    return { row: r, map: map };
                }
            }
            return null;
        };

        var parseWorkbook = function(wb) {
            var items = [];
            wb.SheetNames.forEach(function (name) {
                var ws = wb.Sheets[name];
                if (!ws) return;
                var rows;
                try { rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }); }
                catch (e) { return; }
                var hdr = findImportHeader(rows);
                if (!hdr) return;
                var map = hdr.map;
                for (var r = hdr.row + 1; r < rows.length; r++) {
                    var row = rows[r] || [];
                    var client = String(row[map.client] == null ? '' : row[map.client]).trim();
                    var date = parseImportDate(row[map.date]);
                    var job = map.job != null ? String(row[map.job] || '').trim() : '';
                    var task = map.task != null ? String(row[map.task] || '').trim() : '';
                    var assoc = map.assoc != null ? String(row[map.assoc] || '').trim() : '';
                    var start = map.start != null ? parseImportTime(row[map.start]) : '';
                    var end = map.end != null ? parseImportTime(row[map.end]) : '';

                    if (!client && !date && !job && !task) continue;
                    if (/^total/i.test(client)) continue;
                    if (job === '-') job = '';
                    if (task === '-') task = '';
                    if (assoc === '-') assoc = '';

                    items.push({
                        client: client, date: date, jobTitle: job, task: task,
                        associates: assoc, startTime: start, endTime: end
                    });
                }
            });
            return items;
        };

        var handleImportFile = function(file) {
            if (!state.user || !state.firebaseReady) { showInfoModal(t('errConnect')); return; }
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
                    var items = parseWorkbook(wb);
                    if (items.length === 0) { showInfoModal(t('importNone')); return; }
                    openImportModal(items, file.name);
                } catch (err) {
                    console.error('Import parse error:', err);
                    showInfoModal(t('importReadErr'));
                }
            };
            reader.onerror = function () { showInfoModal(t('importReadErr')); };
            reader.readAsArrayBuffer(file);
        };

        var openImportModal = function(items, fileName) {
            var existing = {};
            state.entries.forEach(function (e) {
                existing[(e.date || '') + '|' + String(e.client || '').toUpperCase() + '|' + String(e.task || '').trim().toLowerCase()] = true;
            });

            var rowsHTML = items.map(function (it, i) {
                var dup = !!existing[(it.date || '') + '|' + it.client.toUpperCase() + '|' + it.task.toLowerCase()];
                return (
                    '<div class="import-row' + (dup ? ' excluded' : '') + '" data-idx="' + i + '">' +
                    '  <input type="checkbox" class="import-include"' + (dup ? '' : ' checked') + '>' +
                    '  <div class="import-grid">' +
                    '    <input type="date" data-f="date" value="' + esc(it.date) + '">' +
                    '    <input type="text" data-f="client" list="dl-client" placeholder="' + t('fClient') + '" value="' + esc(it.client) + '">' +
                    '    <input type="time" data-f="start" value="' + esc(it.startTime) + '">' +
                    '    <input type="time" data-f="end" value="' + esc(it.endTime) + '">' +
                    '    <input type="text" data-f="job" list="dl-job" placeholder="' + t('fJob') + '" value="' + esc(it.jobTitle) + '">' +
                    '    <input type="text" data-f="assoc" list="dl-assoc" placeholder="' + t('fAssoc') + '" value="' + esc(it.associates) + '">' +
                    '    <textarea data-f="task" rows="2" placeholder="' + t('fTask') + '">' + esc(it.task) + '</textarea>' +
                         (dup ? '<span class="badge-dup">' + t('importDup') + '</span>' : '') +
                    '  </div>' +
                    '</div>'
                );
            }).join('');

            var overlay = openModal(
                '<div class="modal-icon"><i data-lucide="file-up"></i></div>' +
                '<h4 class="modal-title">' + t('importTitle') + '</h4>' +
                '<p class="modal-sub">' + t('importSub', { count: items.length, file: esc(fileName) }) + '</p>' +
                '<div class="import-list">' + rowsHTML + '</div>' +
                '<div class="modal-actions">' +
                '  <button type="button" class="btn btn-ghost" data-modal-cancel>' + t('modalCancel') + '</button>' +
                '  <button type="button" class="btn btn-primary" data-modal-import></button>' +
                '</div>'
            );
            overlay.querySelector('.modal-panel').classList.add('modal-wide');

            var importBtn = overlay.querySelector('[data-modal-import]');
            var busy = false;
            var updateCount = function () {
                var n = overlay.querySelectorAll('.import-include:checked').length;
                importBtn.innerHTML = '<i data-lucide="file-up"></i> ' + t('importConfirm', { count: n });
                importBtn.disabled = n === 0;
                refreshIcons();
            };
            updateCount();

            overlay.addEventListener('change', function (e) {
                if (e.target.classList.contains('import-include')) {
                    e.target.closest('.import-row').classList.toggle('excluded', !e.target.checked);
                    updateCount();
                }
            });

            overlay.querySelector('[data-modal-cancel]').addEventListener('click', function () {
                if (!busy) closeModal(overlay);
            });

            importBtn.addEventListener('click', async function () {
                if (busy) return;
                var selected = [];
                var hasInvalid = false;
                overlay.querySelectorAll('.import-row').forEach(function (rowEl) {
                    rowEl.classList.remove('invalid');
                    if (!rowEl.querySelector('.import-include').checked) return;
                    var get = function (f) {
                        var el = rowEl.querySelector('[data-f="' + f + '"]');
                        return el ? el.value.trim() : '';
                    };
                    var item = {
                        client: get('client'), date: get('date'), startTime: get('start'),
                        endTime: get('end'), jobTitle: get('job'), associates: get('assoc'), task: get('task')
                    };
                    if (!item.client || !item.date || (!item.jobTitle && !item.task)) {
                        hasInvalid = true;
                        rowEl.classList.add('invalid');
                        return;
                    }
                    selected.push(item);
                });

                if (hasInvalid) { showInfoModal(t('importInvalid')); return; }
                if (selected.length === 0) return;

                busy = true;
                importBtn.disabled = true;
                importBtn.innerHTML = '<span class="spinner"></span> ' + t('importing');

                var fs = window.FirebaseServices;
                var colRef = fs.collection(fs.db, 'artifacts', fs.appId, 'public', 'data', safeCollectionKey(state.accessKey));
                try {
                    await Promise.all(selected.map(function (it) {
                        return fs.addDoc(colRef, {
                            client: it.client.toUpperCase(),
                            jobTitle: it.jobTitle,
                            task: it.task,
                            date: it.date,
                            startTime: it.startTime,
                            endTime: it.endTime || '',
                            hours: (it.startTime && it.endTime) ? calcHours(it.startTime, it.endTime) : 0,
                            noTime: !it.startTime && !it.endTime,
                            associates: it.associates || '-',
                            author: state.userName,
                            userId: state.user.uid,
                            createdAt: new Date().toISOString()
                        });
                    }));

                    // Jump to the month of the newest imported entry so results are visible
                    var newest = selected.map(function (x) { return x.date; }).sort().pop();
                    var nd = new Date(newest);
                    if (!isNaN(nd)) {
                        state.currentMonth = nd.getMonth();
                        state.currentYear = nd.getFullYear();
                        updateMonthLabel();
                        refreshDynamic();
                    }
                    closeModal(overlay);
                    showToast(t('importDone', { count: selected.length }));
                } catch (err) {
                    console.error('Import Error:', err);
                    showInfoModal(t('syncErr'));
                    updateCount();
                } finally {
                    busy = false;
                }
            });
        };

        /* ---------- Excel export (Multi-Month) ---------- */
        var exportExcel = function() {
            if (state.entries.length === 0) {
                showToast(t('exportEmpty'), 'alert-circle');
                return;
            }

            // Group strictly by YYYY-MM
            var grouped = {};
            state.entries.forEach(function(e) {
                var d = new Date(e.date);
                if (isNaN(d)) return;
                var k = d.getFullYear() + '-' + String(d.getMonth()).padStart(2, '0');
                if (!grouped[k]) grouped[k] = { entries: [], month: d.getMonth(), year: d.getFullYear() };
                grouped[k].entries.push(e);
            });

            var keys = Object.keys(grouped).sort(function(a, b) { return b.localeCompare(a); });
            if (keys.length === 0) {
                showToast(t('exportEmpty'), 'alert-circle');
                return;
            }

            var wb = XLSX.utils.book_new();

            keys.forEach(function(k) {
                var group = grouped[k];
                var monthNameIndo = i18n['id'].months[group.month]; 
                var sheetName = monthNameIndo + ' ' + group.year;
                var totalHours = getTotalHours(group.entries);
                var safeUserName = state.userName || 'User';

                var wsData = [
                    ["TIMESHEET REPORT"],
                    ["NAMA", ":", safeUserName],
                    ["BULAN", ":", sheetName],
                    ["KODE ID", ":", state.accessKey],
                    [],
                    ["TANGGAL", "KLIEN", "PEKERJAAN", "DETAIL PEKERJAAN", "ASSOCIATES", "WAKTU MULAI", "WAKTU SELESAI", "DURASI (JAM)"]
                ];

                var sortedEntries = group.entries.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

                sortedEntries.forEach(function(e) {
                    wsData.push([
                        e.date,
                        e.client,
                        e.jobTitle || '-',
                        e.task,
                        e.associates || '-',
                        e.noTime ? '-' : (e.startTime || '-'),
                        e.noTime ? '-' : (e.endTime || 'Masih Berjalan'),
                        e.noTime ? '-' : e.hours
                    ]);
                });

                wsData.push([]);
                wsData.push(["", "", "", "", "", "", "TOTAL JAM", totalHours.toFixed(1)]);

                var ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [
                    { wch: 12 }, { wch: 25 }, { wch: 25 }, { wch: 50 }, { wch: 20 }, { wch: 15 }, { wch: 15 }, { wch: 15 }
                ];
                
                // Keep sheetName under 31 characters limit of Excel
                XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31));
            });

            /* ---------- Recap sheet: work per client across all recorded months ---------- */
            var recapEntries = state.entries.filter(function (e) { return !isNaN(new Date(e.date)); })
                .sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

            if (recapEntries.length > 0) {
                var monthsEn = i18n.en.months;
                var firstD = new Date(recapEntries[0].date);
                var lastD = new Date(recapEntries[recapEntries.length - 1].date);
                var period;
                if (firstD.getFullYear() !== lastD.getFullYear()) {
                    period = monthsEn[firstD.getMonth()] + ' ' + firstD.getFullYear() + ' – ' + monthsEn[lastD.getMonth()] + ' ' + lastD.getFullYear();
                } else if (firstD.getMonth() !== lastD.getMonth()) {
                    period = monthsEn[firstD.getMonth()] + ' – ' + monthsEn[lastD.getMonth()] + ' ' + lastD.getFullYear();
                } else {
                    period = monthsEn[firstD.getMonth()] + ' ' + lastD.getFullYear();
                }

                var byClient = {};
                recapEntries.forEach(function (e) {
                    var name = e.client || '-';
                    if (!byClient[name]) byClient[name] = { bullets: [], seen: {}, hours: 0 };
                    var g = byClient[name];
                    g.hours += parseFloat(e.hours || 0);
                    var desc = ((e.jobTitle && e.jobTitle !== '-') ? e.jobTitle + ' — ' : '') + (e.task || '');
                    desc = desc.trim();
                    var dk = desc.toLowerCase();
                    if (desc && !g.seen[dk]) { g.seen[dk] = true; g.bullets.push('• ' + desc); }
                });

                var recapData = [
                    ["WORK RECAP BY CLIENT"],
                    [(state.userName || 'User') + '  |  ID Code: ' + state.accessKey + '  |  Period: ' + period],
                    [],
                    ["NO", "CLIENT NAME / CODE", "BRIEF WORK DESCRIPTION", "TOTAL HOURS"]
                ];

                Object.keys(byClient).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (name, idx) {
                    var g = byClient[name];
                    if (g.bullets.length === 0) {
                        recapData.push([idx + 1, name, '-', parseFloat(g.hours.toFixed(2))]);
                        return;
                    }
                    g.bullets.forEach(function (bullet, i) {
                        recapData.push(i === 0
                            ? [idx + 1, name, bullet, parseFloat(g.hours.toFixed(2))]
                            : ["", "", bullet, ""]);
                    });
                });

                var wsRecap = XLSX.utils.aoa_to_sheet(recapData);
                wsRecap['!cols'] = [{ wch: 5 }, { wch: 32 }, { wch: 90 }, { wch: 12 }];
                XLSX.utils.book_append_sheet(wb, wsRecap, "Recap");
            }

            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            var safeUserName = state.userName || 'User';
            var fileName = yyyy + '.' + mm + '.' + dd + ' - [TIMESHEET] ' + safeUserName + '.xlsx';

            XLSX.writeFile(wb, fileName);
            showToast(t('exportSuccess'), 'download');
        };

        /* =====================================================
           Router + init
           ===================================================== */
        var render = function() {
            if (!state.isLoggedIn) { renderLogin(); return; }
            if (!state.userName) { renderName(); return; }
            renderApp();
        };

        render();
        bootFirebase();
    })();
    </script>
